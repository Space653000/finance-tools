<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIRE 退休試算</title>
<meta name="theme-color" content="#0A7C74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIRE試算">
<meta name="description" content="FIRE 財務自由退休試算：FI 數字、幾歲能退、五型態(瘦/Coast/Barista/傳統/胖FIRE)、4%法則與3%長壽命調整、五種提領法則(固定4%、Guyton-Klinger護欄、VPW、Vanguard動態、固定比例)、蒙地卡羅存活率、歷史序列回測、台灣三支柱(勞保年金/勞退新制/國民年金)缺口分析。四語系、深淺色、全部本地運算不外傳。">
<link rel="canonical" href="https://money.space653000.workers.dev/tools/fire/">
<link rel="apple-touch-icon" href="../../assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --tint:#0A7C74; --amber:#B87410; --danger:#B93A25; --ok:#1F7A46;
  --bg:#F2F2F7; --card:#FFF;
  --label:#000; --label2:rgba(60,60,67,.82); --label3:rgba(60,60,67,.4);
  --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.13); --fill2:rgba(120,120,128,.2);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --barbg:rgba(247,247,250,.96); --hh:120px;
}
body.dark{
  --tint:#3FA7A0; --amber:#E8A33D; --danger:#E2705A; --ok:#30D158;
  --bg:#000; --card:#1C1C1E;
  --label:#FFF; --label2:rgba(235,235,245,.68); --label3:rgba(235,235,245,.4);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --shadow:0 1px 3px rgba(0,0,0,.4); --barbg:rgba(20,20,22,.96);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
html{background:#F2F2F7;color-scheme:light}
html.dark{background:#000;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang TC","Heiti TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Meiryo",
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK TC",sans-serif;
  background:var(--bg);color:var(--label);font-size:16px;line-height:1.5;
  font-feature-settings:"tnum" 1;padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow-wrap:break-word;
}
button,input,select{font:inherit;color:inherit;font-feature-settings:"tnum" 1;max-width:100%}
select option{background:var(--card);color:var(--label)}
svg{display:block;max-width:100%}
header{position:sticky;top:0;z-index:50;background:var(--barbg);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hrow{max-width:1360px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:7px}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:19px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.htxt span{display:block;font-size:12.5px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scrolled .htxt span{display:none}
@media(max-width:560px){.htxt span{display:none}}
.tbtn{background:var(--fill);border:none;border-radius:980px;padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.tbtn:hover{background:var(--fill2)}
.tbtn.pri{background:var(--tint);color:#fff}
.tbtn:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
select.lang{background:var(--fill);border:none;border-radius:980px;padding:8px 10px;font-size:13.5px;font-weight:600;cursor:pointer;flex:none;color:var(--label)}
.keyin{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:0 14px 10px;gap:12px}
.key{min-width:0}
.key + .key{border-left:.5px solid var(--sep);padding-left:12px}
.key .l{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.12;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .s{font-size:12px;color:var(--label2);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:520px){.key .n{font-size:23px}}
main{max-width:1360px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr);padding:12px}}
.col{display:grid;gap:13px;min-width:0}
@media(min-width:981px){.left{position:sticky;top:calc(var(--hh) + 12px);max-height:calc(100vh - var(--hh) - 26px);overflow-y:auto;overflow-x:hidden;padding-right:4px}}
.left::-webkit-scrollbar{width:6px}
.left::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.sec{font-size:14px;font-weight:700;color:var(--label);padding:4px 4px 0;display:flex;align-items:center;gap:10px;min-width:0}
.sec button{background:none;border:none;color:var(--tint);font-size:13.5px;font-weight:600;cursor:pointer;padding:2px 0;flex:none}
.sec .sp{margin-left:auto}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.f{padding:12px 14px}
.f + .f{border-top:.5px solid var(--sep)}
.ftop{display:flex;align-items:center;gap:9px;margin-bottom:4px;min-width:0}
.ftop label{font-size:15px;flex:1;min-width:0;line-height:1.35}
.info{width:20px;height:20px;border-radius:50%;background:var(--fill);border:none;color:var(--label2);font-size:11.5px;font-weight:700;cursor:pointer;flex:none;line-height:20px;text-align:center}
.num{width:120px;text-align:right;background:var(--fill);border:none;border-radius:8px;padding:8px 10px;font-size:16px;font-weight:600;-moz-appearance:textfield;flex:none}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:2px solid var(--tint)}
.u{font-size:14px;color:var(--label2);min-width:24px;text-align:left;flex:none}
.chip{background:var(--fill);color:var(--label2);font-size:12px;font-weight:600;padding:3px 7px;border-radius:980px;white-space:nowrap;flex:none}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-8px}
body.dark input[type=range]::-webkit-slider-thumb{background:#F2F2F7}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff}
.expl{font-size:13.5px;line-height:1.62;color:var(--label2);background:var(--fill);border-radius:9px;padding:10px 11px;margin-top:8px;display:none}
.expl.on{display:block}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 14px;min-width:0;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:none;background:none;font-size:13.5px;font-weight:500;padding:8px 2px;border-radius:7px;cursor:pointer;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16)}
body.dark .seg button.on{background:#48484A}
select.sel{background:var(--fill);border:none;border-radius:8px;padding:5px 7px;font-size:13px;font-weight:600;cursor:pointer;min-width:0;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;padding:9px 14px;min-height:44px;min-width:0}
.row + .row{border-top:.5px solid var(--sep)}
.row .k{font-size:15px;flex:1;min-width:0}
.sw{width:46px;height:28px;border-radius:980px;background:var(--fill2);border:none;position:relative;cursor:pointer;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
.empty{padding:18px 14px;text-align:center;font-size:13px;color:var(--label2);line-height:1.65}
.warn{margin:0 14px 11px;padding:9px 10px;border-radius:9px;font-size:11.8px;line-height:1.6;background:rgba(184,116,16,.13);color:var(--amber);font-weight:500}
body.dark .warn{background:rgba(232,163,61,.14)}
.hero{padding:16px 16px 4px}
.conc{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.34}
.concs{font-size:14px;color:var(--label2);margin-top:8px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);margin-top:14px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats > div{padding:12px 6px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.stats > div:first-child{border-left:none}
@media(max-width:640px){.stats > div:nth-child(3){border-left:none}.stats > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.stats .n{font-size:21px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .l{font-size:12px;color:var(--label2);margin-top:3px}
.reads{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.reads{grid-template-columns:repeat(2,1fr)}}
.reads > div{padding:13px 4px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.reads > div:first-child{border-left:none}
@media(max-width:640px){.reads > div:nth-child(3){border-left:none}.reads > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.reads .n{font-size:22px;font-weight:700;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reads .l{font-size:12px;color:var(--label2);margin-top:3px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr)}
@media(max-width:640px){.grid5{grid-template-columns:repeat(2,1fr)}}
.vt{padding:12px 6px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.vt:first-child{border-left:none}
@media(max-width:640px){.vt:nth-child(odd){border-left:none}.vt:nth-child(n+3){border-top:.5px solid var(--sep)}}
.vt .n{font-size:17px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt .l{font-size:12px;color:var(--label2);margin-top:3px}
.vt .b{font-size:10px;font-weight:700;margin-top:4px;padding:1px 6px;border-radius:980px;display:inline-block}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar{width:6px;height:6px}
.tw::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.tw.full{max-height:360px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;font-size:14.5px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:13px;font-weight:600;color:var(--label2);border-bottom:.5px solid var(--sep);position:sticky;top:0;background:var(--card);z-index:1}
tbody tr + tr{border-top:.5px solid var(--sep)}
tr.gap td{color:var(--label2);font-size:12px;text-align:center;padding:6px}
td.v{font-weight:700}
.note{padding:12px 14px;font-size:13.5px;line-height:1.66;color:var(--label2);border-top:.5px solid var(--sep)}
.note b{color:var(--label);font-weight:600}
.disc{font-size:13px;line-height:1.7;color:var(--label2);padding:12px 6px 0}
.adv{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.adv + .adv{border-top:.5px solid var(--sep)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.adv .ac{flex:1;min-width:0}
.adv .at{font-size:15px;font-weight:600;line-height:1.42}
.adv .ad{font-size:13.5px;color:var(--label2);line-height:1.62;margin-top:4px}
.jur{margin:0 0 4px;padding:11px 13px;border-radius:10px;background:var(--fill);font-size:13px;line-height:1.6;color:var(--label2)}
.mini{background:var(--fill);border:none;border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--tint);cursor:pointer;flex:none}
.mini:hover{background:var(--fill2)}
.dm{padding:10px 14px;display:flex;align-items:center;gap:8px}
.dm + .dm{border-top:.5px solid var(--sep)}
.dm .dk{font-size:13px;flex:1}
.gauge{display:flex;align-items:center;gap:16px;padding:14px}
.gauge .gv{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.gauge .gl{font-size:12px;color:var(--label2);margin-top:4px;line-height:1.5}
.adslot{min-height:0}.adslot:not(:empty){min-height:90px;margin:10px 14px;display:flex;align-items:center;justify-content:center;background:var(--fill);border-radius:12px;color:var(--label3);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htxt"><b id="hTitle">FIRE 退休試算</b><span id="hSub"></span></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="0">繁體中文</option><option value="1">English</option>
      <option value="2">日本語</option><option value="3">한국어</option>
    </select>
    <button class="tbtn pri" id="save">存檔</button>
    <button class="tbtn" id="mode">深色</button>
    <button class="tbtn" id="reset">重設</button>
  </div>
  <div class="keyin">
    <div class="key"><div class="l" id="k1l">—</div><div class="n" id="k1n" style="color:var(--tint)">—</div><div class="s" id="k1s">—</div></div>
    <div class="key"><div class="l" id="k2l">—</div><div class="n" id="k2n">—</div><div class="s" id="k2s">—</div></div>
  </div>
</header>

<main>
  <div class="col left">
    <div class="jur" id="jur"></div>

    <!-- 你的現況 -->
    <div class="sec" id="s_now"></div>
    <div class="card">
      <div class="f"><div class="ftop"><label id="l_age"></label><input class="num" id="age" type="number" inputmode="numeric" value="35"><span class="u" id="u_age"></span></div></div>
      <div class="f"><div class="ftop"><label id="l_port"></label><input class="num" id="port" type="number" inputmode="numeric" value="2000000"><span class="u">NT$</span></div></div>
      <div class="f"><div class="ftop"><label id="l_save"></label><input class="num" id="save_m" type="number" inputmode="numeric" value="40000"><span class="u">NT$</span></div></div>
      <div class="f"><div class="ftop"><label id="l_step"></label><input class="num" id="step" type="number" inputmode="decimal" value="2"><span class="u">%</span></div></div>
    </div>

    <!-- 退休目標 -->
    <div class="sec" id="s_goal"></div>
    <div class="card">
      <div class="f"><div class="ftop"><label id="l_rage"></label><input class="num" id="rage" type="number" inputmode="numeric" value="55"><span class="u" id="u_rage"></span></div></div>
      <div class="f"><div class="ftop"><label id="l_plan"></label><input class="num" id="plan" type="number" inputmode="numeric" value="95"><span class="u" id="u_plan"></span></div></div>
      <div class="f"><div class="ftop"><label id="l_exp"></label><input class="num" id="exp_m" type="number" inputmode="numeric" value="50000"><span class="u">NT$</span></div>
        <div class="expl" id="e_exp"></div></div>
      <div class="f"><div class="ftop"><label id="l_lean"></label><input class="num" id="lean_m" type="number" inputmode="numeric" value="30000"><span class="u">NT$</span></div></div>
      <div class="f"><div class="ftop"><label id="l_fat"></label><input class="num" id="fat_m" type="number" inputmode="numeric" value="100000"><span class="u">NT$</span></div></div>
    </div>

    <!-- 報酬與通膨 -->
    <div class="sec" id="s_market"></div>
    <div class="card">
      <div class="f"><div class="ftop"><label id="l_ret"></label><input class="num" id="ret" type="number" inputmode="decimal" value="6.5"><span class="u">%</span></div></div>
      <div class="f"><div class="ftop"><label id="l_vol"></label><input class="num" id="vol" type="number" inputmode="decimal" value="16"><span class="u">%</span></div></div>
      <div class="f"><div class="ftop"><label id="l_infl"></label><input class="num" id="infl" type="number" inputmode="decimal" value="2"><span class="u">%</span></div></div>
      <div class="f"><div class="ftop"><label id="l_stock"></label><input class="num" id="stock" type="number" inputmode="numeric" value="80"><span class="u">%</span></div>
        <div class="expl" id="e_stock"></div></div>
    </div>

    <!-- 安全提領 -->
    <div class="sec"><span id="s_swr"></span><button class="sp" id="autoSWR"></button></div>
    <div class="card">
      <div class="f"><div class="ftop"><label id="l_swr"></label><input class="num" id="swr" type="number" inputmode="decimal" value="3.5"><span class="u">%</span></div>
        <div class="expl" id="e_swr"></div></div>
    </div>
    <div class="seg" id="segStrat" style="margin-top:4px">
      <button data-k="constant" class="on"></button><button data-k="gk"></button><button data-k="vpw"></button><button data-k="dynamic"></button><button data-k="fixedpct"></button>
    </div>
    <div class="card" id="stratParams"></div>

    <!-- 台灣三支柱 -->
    <div class="sec" id="s_pension"></div>
    <div class="card">
      <div class="row"><span class="k" id="l_li"></span><button class="sw on" id="sw_li"></button></div>
      <div id="liBox">
        <div class="f"><div class="ftop"><label id="l_lisal"></label><input class="num" id="lisal" type="number" inputmode="numeric" value="45800"><span class="u">NT$</span></div></div>
        <div class="f"><div class="ftop"><label id="l_liyr"></label><input class="num" id="liyr" type="number" inputmode="numeric" value="35"><span class="u" id="u_liyr"></span></div></div>
        <div class="f"><div class="ftop"><label id="l_licl"></label><input class="num" id="licl" type="number" inputmode="numeric" value="65"><span class="u" id="u_licl"></span></div></div>
      </div>
      <div class="row" style="border-top:.5px solid var(--sep)"><span class="k" id="l_lp"></span><button class="sw on" id="sw_lp"></button></div>
      <div id="lpBox">
        <div class="f"><div class="ftop"><label id="l_lpsal"></label><input class="num" id="lpsal" type="number" inputmode="numeric" value="60000"><span class="u">NT$</span></div></div>
        <div class="f"><div class="ftop"><label id="l_lpemp"></label><input class="num" id="lpemp" type="number" inputmode="decimal" value="6"><span class="u">%</span></div></div>
        <div class="f"><div class="ftop"><label id="l_lpvol"></label><input class="num" id="lpvol" type="number" inputmode="decimal" value="0"><span class="u">%</span></div></div>
        <div class="f"><div class="ftop"><label id="l_lpyr"></label><input class="num" id="lpyr" type="number" inputmode="numeric" value="35"><span class="u" id="u_lpyr"></span></div></div>
        <div class="f"><div class="ftop"><label id="l_lpret"></label><input class="num" id="lpret" type="number" inputmode="decimal" value="3"><span class="u">%</span></div></div>
      </div>
      <div class="row" style="border-top:.5px solid var(--sep)"><span class="k" id="l_np"></span><button class="sw" id="sw_np"></button></div>
      <div id="npBox" style="display:none">
        <div class="f"><div class="ftop"><label id="l_npyr"></label><input class="num" id="npyr" type="number" inputmode="numeric" value="0"><span class="u" id="u_npyr"></span></div></div>
      </div>
    </div>

    <!-- 退休現金流設定（v2） -->
    <div class="sec" id="s_survin"></div>
    <div class="card">
      <div class="f"><div class="ftop"><label id="l_ess"></label><input class="num" id="essential_m" type="number" inputmode="numeric" value="35000"><span class="u">NT$</span></div></div>
      <div class="f"><div class="ftop"><label id="l_disc"></label><input class="num" id="disc_m" type="number" inputmode="numeric" value="15000"><span class="u">NT$</span></div></div>

 "During-grace payment = loan × monthly rate (interest only); after grace it amortizes over the remaining term. Net worth = (portfolio + loan) compounded − loan balance; the FI age above now uses net worth. Make sure your future income can afford the higher post-grace payment — the classic failure point of leverage. Not a recommendation; for estimation only.",
 "据置中=借入×月利率（利息のみ）、据置後は残期間で元利均等。純資産=（資産+借入）の複利−残債。上のFI年齢は純資産基準。据置後の高い返済に耐えられるか要確認。助言ではありません。",
 "거치 중=대출×월이율(이자만), 거치 후 잔여기간 원리금균등. 순자산=(자산+대출) 복리−잔액. 위 FI 나이는 순자산 기준. 거치 후 높은 상환 감당 가능한지 확인. 권유 아님, 시산용."],

eSwr:["4%法則來自30年退休期。若你想 50 歲退休、退休期達 40–50 年，建議降到 3%–3.5%。按「自動」用規劃年數估算。",

stratK:[["固定4%","Guyton-Klinger","VPW","Vanguard動態","固定比例"],
 ["Constant 4%","Guyton-Klinger","VPW","Vanguard dynamic","Fixed %"],

 ["고정4%","Guyton-Klinger","VPW","Vanguard동적","고정비율"]],
stratDesc:[
 ["固定實質提領：第一年提領 = 資產×SWR，其後每年隨通膨調整、金額固定。最經典、最好懂，但遇早年大跌（序列風險）最脆弱。",
  "Constant real: first year = portfolio×SWR, then held flat in real terms. Classic and simple, but most exposed to an early crash (sequence risk).",
  "固定実質：初年=資産×SWR、以降は実質一定。最も古典的だが早期暴落に最も脆弱。",
  "고정 실질: 첫해=자산×SWR, 이후 실질 고정. 가장 고전적이나 초기 급락에 가장 취약."],
 ["護欄法則：初始提領率較高（如5%），當提領率>初始×1.2 砍 10%、<初始×0.8 加 10%，負報酬年凍結通膨。彈性換取更高起始提領。",
  "Guardrails: start higher (e.g. 5%); cut 10% when the withdrawal rate exceeds 1.2× initial, raise 10% below 0.8×, freeze inflation after down years. Flexibility buys a higher start.",
  "ガードレール：高め開始(例5%)、取崩率>初期×1.2で10%減、<0.8で10%増、下落年はインフレ調整凍結。",
  "가드레일: 높게 시작(예5%), 인출률>초기×1.2면 10%↓, <0.8이면 10%↑, 하락년 물가동결."],
 ["變動百分比：每年提領 = 餘額 × 隨年齡上升的比例（用剩餘年數年金因子）。永不歸零，但支出隨市場波動較大。",
  "VPW: each year withdraw balance × an age-rising percentage (annuity factor on remaining years). Never depletes, but spending swings with the market.",
  "VPW：毎年 残高×年齢で上がる比率。枯渇しないが支出変動が大きい。",
  "VPW: 매년 잔액×나이에 따라 오르는 비율. 고갈 없으나 지출 변동 큼."],
 ["Vanguard 動態：目標=餘額×比率，但每年變動限制在天花板(+5%)與地板(−2.5%)之間，兼顧穩定與彈性。",
  "Vanguard dynamic: target = balance×rate, but yearly change is capped by a ceiling (+5%) and floor (−2.5%) — stability with flexibility.",
  "Vanguard動的：目標=残高×率、年変動を天井+5%/床−2.5%に制限。",
  "Vanguard동적: 목표=잔액×비율, 연 변동을 천장+5%/바닥−2.5%로 제한."],
 ["固定比例：每年提領固定比例的『當前餘額』。永不歸零，市場好多花、市場差少花，最保命但支出最不穩。",
  "Fixed %: withdraw a fixed percentage of the current balance each year. Never depletes — spend more in good years, less in bad. Safest for the portfolio, least stable spending.",
  "固定比率：毎年 現残高の一定比率。枯渇せず、相場次第で増減。",
  "고정비율: 매년 현재 잔액의 일정 비율. 고갈 없고 시장따라 증감."]],

 const a=Math.abs(n);
 if(LG===1){ if(a>=1e9)return "NT$"+(n/1e9).toFixed(2)+"B"; if(a>=1e6)return "NT$"+(n/1e6).toFixed(2)+"M"; if(a>=1e3)return "NT$"+(n/1e3).toFixed(0)+"K"; return "NT$"+Math.round(n).toLocaleString("en-US"); }
 // 中日韓：萬／億
 if(a>=1e8) return "NT$"+(n/1e8).toFixed(2)+(LG===3?"억":"億"); // zh/ja=億, ko=억
 if(a>=1e4) return "NT$"+(n/1e4).toFixed(1)+(LG===2?"万":LG===3?"만":"萬"); // zh=萬, ja=万, ko=만
 return "NT$"+Math.round(n).toLocaleString("en-US");
}

 const num=(id,def)=>{const el=document.getElementById(id);if(!el)return def;const v=parseFloat(el.value);return isNaN(v)?def:v;};
 S.age=num("age",35); S.port=num("port",0); S.save_m=num("save_m",0); S.step=num("step",0);

/* ==================== 核心計算 ==================== */
function compute(){
 readInputs();
 const realRet=E.realFromNominal(S.ret,S.infl); // 實質報酬（小數）
 const yearsToRetire=Math.max(0,S.rage-S.age);
 const monthsToRetire=Math.round(yearsToRetire*12);
 const drawYears=Math.max(1,S.plan-S.rage);
 const baseAnnual=S.exp_m*12, leanAnnual=S.lean_m*12, fatAnnual=S.fat_m*12;
 const swr=S.swr;

 // 台灣年金（月領，視為今日實質值）
 const li=S.li?E.laborInsurancePension({avgInsuredSalary:S.lisal,insuredYears:S.liyr,claimAge:S.licl,statutoryAge:65}):{monthly:0};
 const lp=S.lp?E.laborPensionNew({monthlySalary:S.lpsal,employerPct:S.lpemp,voluntaryPct:S.lpvol,years:S.lpyr,investReturnPct:S.lpret,annuityYears:Math.max(1,S.plan-65)}):{monthly:0};
 const np=S.np?E.nationalPension({insuredYears:S.npyr}):{monthly:0};
 const pensionMonthly=li.monthly+lp.monthly+np.monthly;
 const pensionAnnual=pensionMonthly*12;
 const pensionStartAge=Math.max(S.licl||65,65);
 const yearsToPensionFromRetire=Math.max(0,pensionStartAge-S.rage);
 const pensionDrawYears=Math.max(0,S.plan-pensionStartAge);
 // 年金現值（實質）抵減 FI
 const offset=E.pensionGapOffset({pensionAnnual:pensionAnnual,yearsToPensionFromRetire:yearsToPensionFromRetire,pensionYears:pensionDrawYears,realDiscountPct:realRet*100,inflationPct:S.infl}).presentValue;

 // FI 數字（傳統）與抵減後目標
 const fiTrad=E.fiNumber(baseAnnual,swr);
 const fiAdjusted=Math.max(0,fiTrad-offset);

 // 槓桿投資（選用）：借款一次投入，淨值＝投資市值−借款餘額
 const loanCfg=S.lev?{loanAmount:S.levAmt,ratePct:S.levRate,years:S.levYears,graceYears:S.levGrace,method:S.levMethod}:null;
 const lev=S.lev?E.leverageLoan(loanCfg):null;

 // 累積：達 fiAdjusted 的月數（有槓桿改用淨值）
 const m2fi=S.lev
   ? E.accumulateLeveraged({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,months:1200,target:fiAdjusted,loan:loanCfg}).hitMonth
   : E.monthsToTarget({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,target:fiAdjusted,capMonths:1200});
 const fiAgeExact=m2fi==null?null:S.age+m2fi/12;
 const fiAge=fiAgeExact==null?null:Math.ceil(fiAgeExact);

 // 目標退休年齡時的資產（有槓桿改用淨值）
 const projAtRetire=S.lev
   ? (function(){const a=E.accumulateLeveraged({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,months:monthsToRetire,target:null,loan:loanCfg});return a.yearEnd.length?a.yearEnd[a.yearEnd.length-1]:S.port;})()
   : E.accumulate({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,months:monthsToRetire}).endValue;
 const feasibleAtTarget=projAtRetire>=fiAdjusted-1e-6;

 // 每月需投入（達 fiAdjusted at rage，忽略 step 的簡化式）
 const rm=E.annualToMonthly(realRet);
 let needMonthly=0;
 if(monthsToRetire>0){
   const grow=Math.pow(1+rm,monthsToRetire);
   const annuity=rm===0?monthsToRetire:(grow-1)/rm;
   needMonthly=Math.max(0,(fiAdjusted-S.port*grow)/annuity);
 }

 // 五型態
 const variants=E.fireVariants({fatExpense:fatAnnual,baseExpense:baseAnnual,leanExpense:leanAnnual,swrPct:swr,
   coast:{realReturnPct:realRet*100,yearsToTraditional:Math.max(0,65-S.age),currentPortfolio:S.port}});
 const barista=E.baristaFire({annualExpense:baseAnnual,partTimeAnnualIncome:S.part_m*12,swrPct:swr});

 // 提領期參數（實質框架：inflation=0，pension 視為實質固定）
 const initialDraw=feasibleAtTarget?projAtRetire:fiAdjusted; // 用實際可備妥或目標較大者中的可備妥；若不足用projAtRetire
 const initDrawBal=Math.max(projAtRetire,0);
 const spend0=baseAnnual;
 const pensionForDraw={annualAmount:pensionAnnual,startYear:Math.max(1,pensionStartAge-S.rage+1),growWithInflation:false};
 const stratParams={
   constant:{}, gk:{initialWRPct:S.initWR,spend0:undefined},
   vpw:{expectedRealReturnPct:S.vpwRet}, dynamic:{targetWRPct:S.fixedPct,ceilingPct:S.ceil,floorPct:S.floor},
   fixedpct:{pctPerYear:S.fixedPct},
 }[S.strat]||{};

 // 蒙地卡羅（實質：mean=realRet, infl=0）
 const mc=E.monteCarloRetirement({initial:initDrawBal,spend0:spend0,years:drawYears,
   nominalMeanPct:realRet*100,volPct:S.vol,inflationPct:0,strategy:S.strat,strategyParams:stratParams,
   pension:pensionForDraw,legacyTarget:S.legacy,N:S.sims,seed:20260807});

 // 歷史回測（實質資料）
 const hist=E.historicalBacktest(HIST.stock.map(x=>x/100),HIST.bond.map(x=>x/100),{
   initial:initDrawBal,spend0:spend0,years:drawYears,stockPct:S.stock,inflationPct:0,
   strategy:S.strat,strategyParams:stratParams,pension:pensionForDraw,legacyTarget:S.legacy});

 // 五策略比較（同一條期望實質報酬平坦路徑做點估；成功率取自各自 MC 小樣本）
 const flat=new Array(drawYears).fill(realRet);
 const stratRows=["constant","gk","vpw","dynamic","fixedpct"].map(name=>{
   const sp={constant:{},gk:{initialWRPct:S.initWR},vpw:{expectedRealReturnPct:S.vpwRet},
     dynamic:{targetWRPct:S.fixedPct,ceilingPct:S.ceil,floorPct:S.floor},fixedpct:{pctPerYear:S.fixedPct}}[name];
   const det=E.runStrategy(name,flat,Object.assign({initial:initDrawBal,spend0:spend0,inflationPct:0,pension:pensionForDraw,legacyTarget:S.legacy},sp));
   const mcS=E.monteCarloRetirement({initial:initDrawBal,spend0:spend0,years:drawYears,nominalMeanPct:realRet*100,volPct:S.vol,inflationPct:0,strategy:name,strategyParams:sp,pension:pensionForDraw,legacyTarget:S.legacy,N:400,seed:99});
   const minSpend=det.minSpend!=null?det.minSpend:spend0;
   return {name,end:det.endBalance,minSpend,success:mcS.successRate};
 });

 // 一生曲線（實質）：累積到 rage，再用選定策略跑 flat 期望路徑
 const accSeries=S.lev
   ? E.accumulateLeveraged({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,months:monthsToRetire,target:null,loan:loanCfg}).yearEnd
   : E.accumulate({initial:S.port,monthlyContribution:S.save_m,stepUpAnnualPct:S.step,realReturnPct:realRet*100,months:monthsToRetire}).yearEnd;
 const drawDet=E.runStrategy(S.strat,flat,Object.assign({initial:initDrawBal,spend0:spend0,inflationPct:0,pension:pensionForDraw,legacyTarget:S.legacy},stratParams));

 // ===== v2 退休存活分析（逐年現金流 + 三軌模擬 + Rich-Broke-Dead）=====
 const careStart=Math.max(S.rage+1,S.careAge);
 const v2plan={
   retireAge:S.rage, initialPortfolio:Math.max(0,projAtRetire),
   phases:[
     {startAge:S.rage, essentialMonthly:S.essential_m, medicalMonthly:0, discretionaryMonthly:S.disc_m},
     {startAge:careStart, essentialMonthly:S.essential_m, medicalMonthly:S.careMed, discretionaryMonthly:Math.round(S.disc_m*0.5)},
   ],
   oneOffEssential:[], oneOffDiscretionary:(S.oneExpAmt>0&&S.oneExpAge>0)?[{age:S.oneExpAge,amount:S.oneExpAmt}]:[],
   incomeSegments:(S.part_m>0)?[{startAge:S.rage,endAge:Math.max(S.rage,S.partUntil),monthlyAmount:S.part_m}]:[],
   oneOffInflows:(S.oneInAmt>0&&S.oneInAge>0)?[{age:S.oneInAge,amount:S.oneInAmt}]:[],
   pensionAnnual:pensionAnnual, pensionStartAge:pensionStartAge,
   generalInflationPct:S.infl, medicalInflationPct:S.medInfl,
   strategy:S.strat, strategyParams:stratParams,
   glide:{stockStartPct:S.stock, stockEndPct:S.stockEnd}, legacyTarget:S.legacy,
 };
 const stockMeanReal=realRet*100; // 以名目報酬扣通膨為股票實質期望
 const survN=Math.min(S.sims,5000); // v2 模擬固定上限以維持即時性
 const surv=E.simulateRetirement(v2plan,{track:S.track,planAge:S.plan,N:survN,seed:20260808,
   stockMeanPct:stockMeanReal,stockVolPct:S.vol,bondMeanPct:1.0,bondVolPct:6,corr:0.15,
   histStock:HIST.stock.map(x=>x/100),histBond:HIST.bond.map(x=>x/100),block:5});
 const survCurve=E.survivalFromQx(QX,S.rage,surv.years);
 const rbd=E.richBrokeDead(S.rage,surv.solventByYear,survCurve);
 const cfPath=E.runRetirementPath(v2plan,new Array(surv.years).fill(stockMeanReal/100),new Array(surv.years).fill(0.01));

 return {realRet,yearsToRetire,drawYears,baseAnnual,swr,
   li,lp,np,pensionMonthly,pensionAnnual,pensionStartAge,offset,
   fiTrad,fiAdjusted,m2fi,fiAge,fiAgeExact,projAtRetire,feasibleAtTarget,needMonthly,
   variants,barista,mc,hist,stratRows,accSeries,drawDet,initDrawBal,pensionForDraw,lev,
   v2plan,surv,rbd,cfPath};
}

/* ==================== 繪圖工具 ==================== */
function pathFrom(vals,W,H,pad,maxV,minV){
 const n=vals.length; if(n<2) return "";
 const mx=maxV==null?Math.max(...vals):maxV, mn=minV==null?Math.min(...vals,0):minV;
 const rng=(mx-mn)||1;
 return vals.map((v,i)=>{const x=pad+(W-2*pad)*i/(n-1);const y=H-pad-(H-2*pad)*(v-mn)/rng;return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}).join(" ");
}

function drawCurve(r){
 const W=700,H=230,pad=24;
 const acc=r.accSeries.slice(); // 每年末，累積期
 // 提領期年末餘額
 const draw=r.drawDet.rows.map(x=>x.balance);
 const all=acc.concat(draw);
 if(all.length<2){document.getElementById("chCurve").innerHTML="";return;}
 const maxV=Math.max(...all,r.fiAdjusted)*1.05;
 const accPath=pathFrom(acc,W,H,pad,maxV,0);
 // 提領段接續 x：整段長度 = acc.length + draw.length
 const n=all.length;
 const xAt=i=>pad+(W-2*pad)*i/(n-1);
 const yAt=v=>H-pad-(H-2*pad)*v/maxV;
 let dPath="";
 for(let i=0;i<draw.length;i++){const x=xAt(acc.length-1+i);const y=yAt(Math.max(0,draw[i]));dPath+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}
 const fiY=yAt(r.fiAdjusted);
 const retX=xAt(Math.max(0,acc.length-1));
 document.getElementById("chCurve").innerHTML=
  `<line x1="${pad}" y1="${fiY}" x2="${W-pad}" y2="${fiY}" stroke="var(--label3)" stroke-width="1" stroke-dasharray="4 4"/>`+
  `<line x1="${retX}" y1="${pad}" x2="${retX}" y2="${H-pad}" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2 3"/>`+
  `<path d="${accPath}" fill="none" stroke="var(--ok)" stroke-width="2.4"/>`+
  `<path d="${dPath}" fill="none" stroke="var(--tint)" stroke-width="2.4"/>`+
  `<text x="${pad+2}" y="${fiY-4}" font-size="10" fill="var(--label2)">FI ${fmtBig(r.fiAdjusted)}</text>`+
  `<text x="${Math.min(retX+3,W-70)}" y="${pad+10}" font-size="10" fill="var(--amber)">${S.rage}${T("u_age")}</text>`;
}

/* ==================== 儲存（window.storage 優先，localStorage 後備）＋ 儲存方案 ==================== */
const STORE_KEY="firecalc";
const STORAGE=(typeof window!=="undefined"&&window.storage)?window.storage:{
  set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}return Promise.resolve();},
  get:k=>{try{return Promise.resolve(localStorage.getItem(k));}catch(e){return Promise.resolve(null);}},
  delete:k=>{try{localStorage.removeItem(k);}catch(e){}return Promise.resolve();},
};
let lastSaved=0,tSave=0,PLANS=[],LASTR=null;

function readS(){ readInputs(); return JSON.parse(JSON.stringify(S)); }
function applyS(obj){ Object.assign(S,obj); writeInputs(); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 每次重算＝即時重算＋去抖動自動儲存（比照 ETF liveUpdate） */
function run(){ const r=compute(); render(r); LASTR=r; persistD(); }

function persist(){ lastSaved=Date.now(); STORAGE.set(STORE_KEY,JSON.stringify({S:readS(),LG,ts:lastSaved})).catch(()=>{}); updateSavedTime(); }
function persistD(){ clearTimeout(tSave); tSave=setTimeout(persist,800); }
function updateSavedTime(){ const el=document.getElementById("savedTime"); if(!el)return;
  if(!lastSaved){ el.textContent="—"; return; }
  const d=new Date(lastSaved),p=n=>String(n).padStart(2,"0");
  el.textContent=T("savedLabel")+"："+d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function savePlans(){ STORAGE.set(STORE_KEY+"_plans",JSON.stringify(PLANS)).catch(()=>{}); }

/* 儲存方案：把目前所有參數存成一組可比較的方案（與自動儲存並存，不衝突） */
function savePlan(){
  const def=L(D.scDefName)+" "+(PLANS.length+1);
  let name=def; try{ const v=window.prompt(T("scNamePrompt"),def); if(v===null) return; name=v; }catch(e){}
  const r=LASTR||compute();
  PLANS.push({name:(name||def).slice(0,40),ts:Date.now(),S:readS(),
    m:{fi:r.fiAdjusted,fiAge:r.fiAge,mc:r.mc.successRate,hist:r.hist.successRate,need:r.needMonthly}});
  savePlans(); persist(); renderPlans();
}

/* 儲存檔案(全部)：目前設定＋全部方案打包成 JSON；讀取檔案完整還原 */
function exportJSON(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const data=JSON.stringify({S:readS(),LG,plans:PLANS,ts:Date.now(),app:"firecalc",ver:1},null,2);
  const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`fire-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;a.click();
}
function showDataErr(msg){ const el=document.getElementById("dataErr"); if(!el)return; el.textContent=msg||""; el.style.display=msg?"":"none"; }
function importJSON(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(d.app && d.app!=="firecalc" && !d.S) throw 0;
    if(typeof d.LG==="number") LG=d.LG;
    if(d.S) Object.assign(S,d.S);
    if(Array.isArray(d.plans)){ PLANS=d.plans; savePlans(); }
    showDataErr(""); applyLang(); writeInputs(); persist(); run();
  }catch(err){ showDataErr(T("loadFail")); } };
  rd.readAsText(file);
}
function wireData(){
  const ex=document.getElementById("btnExport"); if(ex) ex.onclick=exportJSON;
  const im=document.getElementById("btnImport"); if(im) im.onclick=()=>document.getElementById("fileImport").click();
  const fi=document.getElementById("fileImport"); if(fi) fi.onchange=e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value="";};
  const rd=document.getElementById("btnRestoreDef"); if(rd) rd.onclick=()=>{ if(!confirm(T("resetAsk")))return; applyS(JSON.parse(JSON.stringify(DEF))); persist(); run(); };
  const cl=document.getElementById("btnClear"); if(cl) cl.onclick=()=>{ if(!confirm(T("clearAsk")))return;
    STORAGE.delete(STORE_KEY).catch(()=>{}); STORAGE.delete(STORE_KEY+"_plans").catch(()=>{}); PLANS=[]; savePlans();
    applyS(JSON.parse(JSON.stringify(DEF))); lastSaved=0; updateSavedTime(); renderPlans(); run(); };
  // 方案列表：載入 / 刪除
  const card=document.getElementById("scenarioCard");
  if(card && !card.dataset.wired){ card.dataset.wired="1";
    card.addEventListener("click",e=>{ const lo=e.target.closest("[data-loadp]"), de=e.target.closest("[data-delp]");
      if(lo){ applyS(JSON.parse(JSON.stringify(PLANS[+lo.dataset.loadp].S))); persist(); run(); }
      else if(de){ PLANS.splice(+de.dataset.delp,1); savePlans(); renderPlans(); } }); }
}
async function restore(){
  try{ const r=await STORAGE.get(STORE_KEY); if(r){ const d=JSON.parse(r); if(typeof d.LG==="number")LG=d.LG; if(d.S)Object.assign(S,d.S); if(d.ts)lastSaved=d.ts; }
    const pr=await STORAGE.get(STORE_KEY+"_plans"); if(pr) PLANS=JSON.parse(pr)||[]; }catch(e){}
}

 tog("sw_li","liBox",S.li);tog("sw_lp","lpBox",S.lp);tog("sw_np","npBox",S.np);tog("sw_lev","levBox",S.lev);
 // strat seg
 document.querySelectorAll("#segLevM button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.levMethod));
 document.querySelectorAll("#segStrat button").forEach(b=>b.classList.toggle("on",b.dataset.k===S.strat));
 document.querySelectorAll("#segSims button").forEach(b=>b.classList.toggle("on",+b.dataset.s===S.sims));
 document.querySelectorAll("#segTbl button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.tblView));
 renderStratParams();
}
function tog(swId,boxId,on){const sw=document.getElementById(swId);const box=document.getElementById(boxId);if(sw)sw.classList.toggle("on",on);if(box)box.style.display=on?"":"none";}

function wire(){
 // 所有 number 輸入
 document.querySelectorAll("input.num").forEach(inp=>inp.addEventListener("input",run));
 // info 展開
 document.querySelectorAll(".info").forEach(b=>{});
 // 切換 explains（點 label 區的提示由預設 class 控制；這裡讓部份預設展開）
 ["e_swr","e_exp","e_part","e_stock"].forEach(id=>{});
 // toggles
 [["sw_li","liBox","li"],["sw_lp","lpBox","lp"],["sw_np","npBox","np"],["sw_lev","levBox","lev"]].forEach(([sw,box,key])=>{
  document.getElementById(sw).addEventListener("click",()=>{S[key]=!S[key];tog(sw,box,S[key]);run();});
 });
 // 策略 seg
 document.querySelectorAll("#segStrat button").forEach(b=>b.addEventListener("click",()=>{
  S.strat=b.dataset.k;document.querySelectorAll("#segStrat button").forEach(x=>x.classList.toggle("on",x===b));renderStratParams();run();}));
 // 槓桿還款方式 seg
 document.querySelectorAll("#segLevM button").forEach(b=>b.addEventListener("click",()=>{
  S.levMethod=b.dataset.m;document.querySelectorAll("#segLevM button").forEach(x=>x.classList.toggle("on",x===b));run();}));
 // v2 三軌 seg
 document.querySelectorAll("#segTrack button").forEach(b=>b.addEventListener("click",()=>{
  S.track=b.dataset.t;document.querySelectorAll("#segTrack button").forEach(x=>x.classList.toggle("on",x===b));run();}));
 // sims seg
 document.querySelectorAll("#segSims button").forEach(b=>b.addEventListener("click",()=>{
  S.sims=+b.dataset.s;document.querySelectorAll("#segSims button").forEach(x=>x.classList.toggle("on",x===b));run();}));
 // 明細 seg
 document.querySelectorAll("#segTbl button").forEach(b=>b.addEventListener("click",()=>{
  S.tblView=b.dataset.v;document.querySelectorAll("#segTbl button").forEach(x=>x.classList.toggle("on",x===b));run();}));
 // auto SWR
 document.getElementById("autoSWR").addEventListener("click",()=>{
  readInputs();const s=E.suggestSWR(S.plan-S.rage);document.getElementById("swr").value=s;run();});
 // header
 document.getElementById("lang").addEventListener("change",e=>{LG=+e.target.value;applyLang();writeInputs();run();});
 // 儲存方案（存目前為可比較的一組方案）
 document.getElementById("save").addEventListener("click",()=>{ savePlan();
  const b=document.getElementById("save");const o=b.textContent;b.textContent=T("saved");setTimeout(()=>b.textContent=o,1200);});
 document.getElementById("scSaveBtn").addEventListener("click",savePlan);
 document.getElementById("mode").addEventListener("click",()=>{dark=!dark;document.body.classList.toggle("dark",dark);document.documentElement.classList.toggle("dark",dark);document.getElementById("mode").textContent=dark?T("light"):T("dark");
  document.querySelector('meta[name=theme-color]').setAttribute("content",dark?"#3FA7A0":"#0A7C74");});
 document.getElementById("reset").addEventListener("click",()=>{ if(!confirm(T("resetAsk")))return; applyS(JSON.parse(JSON.stringify(DEF))); persist(); run();});
 // scroll shadow
 addEventListener("scroll",()=>{document.body.classList.toggle("scrolled",scrollY>10);},{passive:true});
 // segTbl labels
 document.querySelectorAll("#segTbl button").forEach((b,i)=>b.textContent=[T("vHide"),T("vBrief"),T("vFull")][i]);
}

/* ==================== 啟動 ==================== */
(function init(){
 restore().then(()=>{
  document.getElementById("lang").value=String(LG);
  applyLang(); wire(); writeInputs();
  document.querySelectorAll("#segTbl button").forEach((b,i)=>b.textContent=[T("vHide"),T("vBrief"),T("vFull")][i]);
  updateSavedTime(); run();
  requestAnimationFrame(()=>{const h=document.querySelector("header").offsetHeight;document.documentElement.style.setProperty("--hh",h+"px");});
 });
})();

/* PWA：註冊 service worker（比照 ETF/mortgage，file:// 下不註冊避免報錯） */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
