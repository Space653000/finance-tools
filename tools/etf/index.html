<style>
:root{
  --tint:#0A7C74; --amber:#B87410; --danger:#B93A25; --ok:#1F7A46;
  --bg:#F2F2F7; --card:#FFF;
  --label:#000; --label2:rgba(60,60,67,.82); --label3:rgba(60,60,67,.4);
  --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.13); --fill2:rgba(120,120,128,.2);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05); --barbg:rgba(247,247,250,.96);
}
body.dark{
  --tint:#3FA7A0; --amber:#E8A33D; --danger:#E2705A; --ok:#30D158;
  --bg:#000; --card:#1C1C1E;
  --label:#FFF; --label2:rgba(235,235,245,.68); --label3:rgba(235,235,245,.4);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.34);
  --shadow:0 1px 3px rgba(0,0,0,.4); --barbg:rgba(20,20,22,.96);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
html{background:#F2F2F7;color-scheme:light}html.dark{background:#000;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Heiti TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Meiryo","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK TC",sans-serif;
  background:var(--bg);color:var(--label);font-size:16px;line-height:1.5;font-feature-settings:"tnum" 1;padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow-wrap:break-word;}
button,input,select{font:inherit;color:inherit;font-feature-settings:"tnum" 1;max-width:100%}
header{position:sticky;top:0;z-index:50;background:var(--barbg);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hrow{max-width:1360px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:7px}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:19px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.htxt span{display:block;font-size:12.5px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.htxt span{display:none}}
.tbtn{background:var(--fill);border:none;border-radius:980px;padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.tbtn.pri{background:var(--tint);color:#fff}
select.lang{background:var(--fill);border:none;border-radius:980px;padding:8px 10px;font-size:13.5px;font-weight:600;cursor:pointer;flex:none;color:var(--label)}
select option,select optgroup{background:var(--card);color:var(--label)}
.keyin{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:0 14px 10px;gap:12px}
.key{min-width:0}.key + .key{border-left:.5px solid var(--sep);padding-left:12px}
.key .l{font-size:12.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.12;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .s{font-size:12px;color:var(--label2);margin-top:2px}
@media(max-width:520px){.key .n{font-size:23px}}
main{max-width:1360px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr);padding:12px}}
.col{display:grid;gap:13px;min-width:0}
.sec{font-size:14px;font-weight:700;color:var(--label);padding:4px 4px 0;display:flex;align-items:center;gap:10px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.f{padding:12px 14px}.f + .f{border-top:.5px solid var(--sep)}
.ftop{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ftop label{font-size:15px;flex:1;min-width:0;line-height:1.35}
.num{width:120px;text-align:right;background:var(--fill);border:none;border-radius:8px;padding:8px 10px;font-size:16px;font-weight:600;-moz-appearance:textfield;flex:none}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num.sm{width:78px}
.num:focus{outline:2px solid var(--tint)}
.wfull{width:100%;background:var(--fill);border:none;border-radius:8px;padding:10px 11px;font-size:16px;font-weight:600}
.u{font-size:14px;color:var(--label2);flex:none}
select.sel{background:var(--fill);border:none;border-radius:8px;padding:10px 11px;font-size:15.5px;font-weight:600;cursor:pointer;width:100%}
select.sel.sm{width:118px;padding:8px 9px}
.go{appearance:none;border:none;background:var(--tint);color:#fff;font-size:17px;font-weight:700;padding:14px;border-radius:12px;width:100%;cursor:pointer;margin-top:4px}
.go:disabled{opacity:.5}
.warn{margin:10px 14px 0;padding:10px 11px;border-radius:9px;font-size:13px;line-height:1.6;background:rgba(184,116,16,.14);color:var(--amber);font-weight:500}
body.dark .warn{background:rgba(232,163,61,.16)}
.hero{padding:16px 16px 6px}
.conc{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.34}
.concs{font-size:14px;color:var(--label2);margin-top:8px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);margin-top:14px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats > div{padding:13px 6px;text-align:center;border-left:.5px solid var(--sep)}
.stats > div:first-child{border-left:none}
@media(max-width:640px){.stats > div:nth-child(3){border-left:none}.stats > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.stats .n{font-size:21px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .l{font-size:12px;color:var(--label2);margin-top:3px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;font-size:14.5px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:13px;font-weight:600;color:var(--label2);border-bottom:.5px solid var(--sep)}
tbody tr + tr{border-top:.5px solid var(--sep)}
td.v{font-weight:700}
.note{padding:12px 14px;font-size:13.5px;line-height:1.66;color:var(--label2);border-top:.5px solid var(--sep)}
.note b{color:var(--label);font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.datamgmt{margin:14px 0 6px;padding:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.dm-time{font-size:13px;color:var(--label2);margin-bottom:10px;min-height:16px;line-height:1.5}
.dm-btns{display:flex;flex-wrap:wrap;gap:8px}
.dm-btn{flex:1;min-width:120px;padding:11px 12px;border:none;border-radius:10px;background:var(--fill);color:var(--label);font-size:14px;font-weight:600;cursor:pointer}
.dm-btn.danger{color:var(--danger)}
.adslot{min-height:0}.adslot:not(:empty){min-height:90px;margin:14px 0;display:flex;align-items:center;justify-content:center;background:var(--fill);border-radius:12px;color:var(--label3);font-size:13px}
.disc{font-size:13px;line-height:1.7;color:var(--label2);padding:12px 6px 0}
.prow{display:flex;align-items:center;gap:8px;padding:9px 14px}
.prow + .prow{border-top:.5px solid var(--sep)}
.prow input.ps{flex:1;background:var(--fill);border:none;border-radius:8px;padding:9px 10px;font-size:15px;font-weight:600}
.prow input.pw{width:84px;text-align:right;background:var(--fill);border:none;border-radius:8px;padding:9px 8px;font-size:15px;font-weight:600}
.prow .dl{background:none;border:none;color:var(--danger);font-size:22px;cursor:pointer;flex:none;line-height:1}
.addbtn{margin:8px 14px 12px;background:var(--fill);border:none;border-radius:9px;padding:11px;width:calc(100% - 28px);font-size:14.5px;font-weight:600;color:var(--tint);cursor:pointer}
.mini{background:var(--fill);border:none;border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--tint);cursor:pointer;flex:none}
#portCard{overflow:visible}
.searchbox{position:relative;padding:12px 14px}
.searchbox input{width:100%;background:var(--fill);border:none;border-radius:10px;padding:12px 12px;font-size:16px;font-weight:600}
.drop{position:absolute;left:14px;right:14px;top:calc(100% - 4px);z-index:40;background:var(--card);border:.5px solid var(--sep);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.dropit{padding:12px 14px;cursor:pointer;font-size:15.5px;border-top:.5px solid var(--sep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dropit:first-child{border-top:none}
.dropit:hover,.dropit.on{background:var(--fill)}
.dropit b{font-weight:700}.dropit span{color:var(--label2);font-size:14px;margin-left:8px}
.psum{font-size:13px;color:var(--label2);padding:0 14px 10px}
.reco{padding:12px 14px}.reco + .reco{border-top:.5px solid var(--sep)}
.reco .rh{display:flex;align-items:center;gap:8px}
.reco .rt{font-size:16px;font-weight:700}
.reco .rw{font-size:13.5px;color:var(--label2);margin-top:4px;line-height:1.55}
.reco .rm{font-size:13px;color:var(--label2);margin-top:3px}
.badge{font-size:12px;font-weight:700;color:#fff;padding:3px 9px;border-radius:980px}
.spec-verdict{font-size:24px;font-weight:800;padding:16px 16px 2px}
.spec-wrap{padding:8px 16px 4px}
.spec-bar{position:relative;height:18px;border-radius:10px;background:linear-gradient(90deg,#1F7A46 0%,#7FB24A 28%,#E7C24A 50%,#D98A2B 72%,#B93A25 100%)}
.spec-dot{position:absolute;top:-5px;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--label);transform:translateX(-14px);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.spec-scale{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin-top:8px}
.advice{margin:10px 16px 0;padding:12px 13px;border-radius:10px;background:var(--fill);font-size:14.5px;line-height:1.6}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="sec" id="secMc"></div>

          <div><div class="n" id="mcP50"></div><div class="l" id="mcP50L"></div></div>

function proxied(u){return PROXY+"/?url="+encodeURIComponent(u);}
function ymStr(y,m){return `${y}-${String(m).padStart(2,"0")}`;}
async function tryFetch(u){try{const r=await fetch(proxied(u));if(!r.ok)return{ok:false,st:r.status};return{ok:true,j:await r.json()};}catch(e){return{ok:false,st:0};}}
async function fetchOne(sym){
 const E=encodeURIComponent(sym),bust="&_="+Date.now(),p2=Math.floor(Date.now()/1000);
 const cands=[
   `https://query1.finance.yahoo.com/v8/finance/chart/${E}?range=max&interval=1mo&events=div,split`,
   `https://query2.finance.yahoo.com/v8/finance/chart/${E}?range=max&interval=1mo&events=div,split`+bust,
   `https://query1.finance.yahoo.com/v8/finance/chart/${E}?range=max&interval=1mo`+bust,
   `https://query2.finance.yahoo.com/v8/finance/chart/${E}?period1=0&period2=${p2}&interval=1mo&events=div,split`+bust,
 ];
 let last=0,j=null;
 for(const u of cands){const r=await tryFetch(u);if(r.ok){j=r.j;break;}last=r.st;}
 if(!j)throw new Error(sym+" HTTP "+(last||"?"));
 const res=j?.chart?.result?.[0];if(!res)throw new Error(sym+" "+L4("查無資料","not found","データなし","없음"));
 const ts=res.timestamp||[],aA=res.indicators?.adjclose?.[0]?.adjclose||[],cA=res.indicators?.quote?.[0]?.close||[];
 const m={};for(let i=0;i<ts.length;i++){const a=aA[i],c=cA[i];if(a==null&&c==null)continue;const d=new Date(ts[i]*1000);
  m[ymStr(d.getFullYear(),d.getMonth()+1)]={adj:a==null?c:a,raw:c==null?a:c,ts:ts[i],div:0};}
 const dd=res.events?.dividends;if(dd)for(const k in dd){const ev=dd[k];const d=new Date((ev.date||0)*1000);const key=ymStr(d.getFullYear(),d.getMonth()+1);if(m[key])m[key].div+=ev.amount||0;}
 return m;
}
// 從各標的的月份 map 挑出「使用區間」：先全歷史交集，再用使用者期間篩，不足則退回全交集
function pickMonths(mapsKeys,startKey,endKey){
 let full=mapsKeys[0].slice();for(let i=1;i<mapsKeys.length;i++){const set=new Set(mapsKeys[i]);full=full.filter(k=>set.has(k));}
 full.sort();
 if(full.length<6)return {keys:[],full,fallback:false,tooFew:true};
 let keys=full.filter(k=>k>=startKey&&k<=endKey);
 let fallback=false;
 if(keys.length<6){keys=full;fallback=true;}
 return {keys,full,fallback,tooFew:false};
}
async function fetchPortfolio(S){
 const syms=PORT.map(p=>normSym(p.sym)).filter(Boolean);if(!syms.length)throw new Error("no symbol");
 const maps=await Promise.all(syms.map(s=>fetchOne(s)));
 const startKey=ymStr(S.startY,S.startM),endKey=ymStr(S.endY,S.endM);
 const pick=pickMonths(maps.map(m=>Object.keys(m)),startKey,endKey);
 if(pick.tooFew)throw new Error(L4("這些標的的共同交易月份太少（可能其中一檔太新，和其他標的沒有足夠重疊）","These ETFs share too few overlapping months (one may be too new)","共通月数が不足","공통 개월 부족"));
 const keys=pick.keys;
 const now=new Date();const nowKey=ymStr(now.getFullYear(),now.getMonth()+1);
 const dates=keys.map(k=>maps[0][k].ts),days=dates.map(t=>(t-dates[0])/86400);
 const assets=syms.map((s,ai)=>({sym:s,adj:keys.map(k=>maps[ai][k].adj),raw:keys.map(k=>maps[ai][k].raw),divs:keys.map(k=>maps[ai][k].div),market:detectMarket(s)}));
 return {ym:keys,dates,days,assets,isFuture:endKey>nowKey,windowFallback:pick.fallback,usedFrom:keys[0],usedTo:keys[keys.length-1]};
}

/* ================= 組合合成 ================= */
function weightsNorm(){const w=PORT.map(p=>+p.w||0);let s=w.reduce((a,b)=>a+b,0);if(s<=0){return PORT.map(()=>1/PORT.length);}return w.map(x=>x/s);}
function assetMonthlyRets(a){const r=[];for(let i=1;i<a.adj.length;i++)r.push(a.adj[i]/a.adj[i-1]-1);return r;}
function synthIndex(D,wN){const n=D.ym.length;const idx=[100];
 for(let i=1;i<n;i++){let rp=0;D.assets.forEach((a,ai)=>{rp+=wN[ai]*(a.adj[i]/a.adj[i-1]-1);});idx.push(idx[i-1]*(1+rp));}return idx;}
/* 逐標的投入陣列：每月定期定額(權重分配) + 單筆加碼(可指定標的或整個組合) */
function buildContribs(D,wN,monthly){
 const n=D.ym.length,A=D.assets.length;
 const plan=D.assets.map(()=>new Array(n).fill(0));
 for(let ai=0;ai<A;ai++)for(let i=0;i<n;i++)plan[ai][i]=wN[ai]*monthly;
 for(const lp of LUMPS){const key=ymStr(lp.y,lp.m);let i=D.ym.indexOf(key);
  if(i<0){if(key<D.ym[0])i=0;else if(key>D.ym[n-1])i=n-1;else continue;} // 落在資料範圍外→夾到最近月份，確保計入
  const amt=+lp.amt||0;if(amt<=0)continue;
  const tsym=normSym(lp.sym||"");let ti=tsym?D.assets.findIndex(a=>a.sym.toUpperCase()===tsym.toUpperCase()):-1;
  if(ti>=0)plan[ti][i]+=amt; else for(let ai=0;ai<A;ai++)plan[ai][i]+=wN[ai]*amt;}
 const dca=D.assets.map((_,ai)=>new Array(n).fill(wN[ai]*monthly));
 const total=plan.reduce((s,arr)=>s+arr.reduce((a,b)=>a+b,0),0);
 const lump=D.assets.map((_,ai)=>{const a=new Array(n).fill(0);a[0]=wN[ai]*total;return a;});
 return {plan,dca,lump};
}
/* 逐標的買進、加總為組合價值（買進持有，不月月再平衡，較貼近真實定期定額） */
function metricsMulti(D,perAsset){
 const n=D.ym.length;let value=0,cost=0;const cfByDay={},val=new Array(n).fill(0),cst=new Array(n).fill(0);
 D.assets.forEach((a,ai)=>{let sh=0,co=0;for(let i=0;i<n;i++){const c=perAsset[ai][i];if(c>0){sh+=c/a.adj[i];co+=c;cost+=c;cfByDay[D.days[i]]=(cfByDay[D.days[i]]||0)-c;}val[i]+=sh*a.adj[i];cst[i]+=co;}value+=sh*a.adj[n-1];});
 cfByDay[D.days[n-1]]=(cfByDay[D.days[n-1]]||0)+value;
 const cfs=Object.keys(cfByDay).map(d=>({day:+d,amt:cfByDay[d]}));
 return {value,cost,totalReturn:cost>0?value/cost-1:0,xirr:ETFEngine.xirr(cfs),val,cst};
}

 ctx.textAlign="center";const ticks=Math.min(8,n);for(let t=0;t<ticks;t++){const i=Math.round((n-1)*t/(ticks-1));ctx.fillStyle=sub;ctx.fillText(String(startYear+i),X(i),H-6);}
 ctx.globalAlpha=.24;ctx.fillStyle=tint;ctx.beginPath();bands.p95.forEach((v,i)=>{i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v));});for(let i=n-1;i>=0;i--)ctx.lineTo(X(i),Y(bands.p5[i]));ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle=tint;ctx.lineWidth=2.6;ctx.beginPath();bands.p50.forEach((v,i)=>{i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v));});ctx.stroke();}

/* ================= 事件 ================= */
/* 即時重算：任何計算欄位一改就用快取資料重算(不重新連網)。標的/日期改動才需要重新「開始試算」。 */
let tCalc=0;
function recompute(){try{if(DATA)compute();}catch(e){}}
function recomputeD(){clearTimeout(tCalc);tCalc=setTimeout(recompute,200);}
function liveUpdate(){persistD();recomputeD();}
["amt","fee","c54","fx","nowAge","retAge","goal","haircut"].forEach(id=>$(id).addEventListener("input",liveUpdate));
["startY","startM","endY","endM"].forEach(id=>$(id).addEventListener("input",persistD)); // 改期間需重新開始試算
["marginal","nhi","reinv"].forEach(id=>$(id).addEventListener("change",liveUpdate));
$("lang").addEventListener("change",e=>{LG=+e.target.value;applyLang();persistD();});
$("theme").addEventListener("click",()=>{document.body.classList.toggle("dark");document.documentElement.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?T("light"):T("dark");if(DATA)compute();});
$("save").addEventListener("click",saveCurrentPlan);
$("plansBody").addEventListener("click",e=>{const l=e.target.closest("[data-load]");
 if(l){applyS(PLANS[+l.dataset.load].S);persist();$("run").click();return;}
 const d=e.target.closest("[data-delp]");if(d){PLANS.splice(+d.dataset.delp,1);savePlans();renderPlans();}});
$("reset").addEventListener("click",()=>{if(!confirm(L4("恢復所有欄位為預設值？","Reset all fields?","初期値に戻す？","기본값으로?")))return;applyS(DEF());persist();});
$("btnRestoreDef").addEventListener("click",()=>{if(!confirm(L4("恢復預設值？","Restore defaults?","初期値に？","기본값?")))return;applyS(DEF());persist();});
$("btnClear").addEventListener("click",()=>{if(!confirm(L4("確定清除本機儲存資料？無法復原。","Clear saved data?","消去しますか？","삭제?")))return;try{if(window.storage)window.storage.delete(STORE_KEY).catch(()=>{});}catch(e){}applyS(DEF());lastSaved=0;updateSavedTime();});
$("btnExport").addEventListener("click",()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
 const data=JSON.stringify({S:readS(),LG,plans:PLANS,seen:SEEN,ts:Date.now(),app:"etfcalc",ver:2},null,2);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`etf-all-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;a.click();URL.revokeObjectURL(a.href);
 alert(L4("已把「所有方案＋所有設定」存成檔案。","Saved all plans + settings to a file.","全プラン＋設定を保存。","모든 플랜+설정 저장."));});
$("btnImport").addEventListener("click",()=>$("fileImport").click());
$("fileImport").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app&&d.app!=="etfcalc"){alert("Not this tool's file");return;}
  if(typeof d.LG==="number")LG=d.LG;if(d.S)applyS(d.S);
  if(Array.isArray(d.plans)){PLANS=d.plans;savePlans();}if(Array.isArray(d.seen)){SEEN=d.seen;}
  applyLang();persist();renderPlans();rebuildDatalist();}catch(err){alert("Load failed");}};rd.readAsText(f);e.target.value="";});
$("run").addEventListener("click",async()=>{const btn=$("run");
 if(!PORT.some(p=>p.sym)){alert(L4("請至少輸入一個標的代號","Enter at least one ETF","銘柄を入力","종목 입력"));return;}
 normalizePort();renderPort();const S=readS();
 btn.disabled=true;const old=btn.textContent;btn.textContent=L4("讀取還原權息數據中…","Loading…","読込中…","로딩…");
 const sig=PORT.map(p=>normSym(p.sym)).filter(Boolean).join(",")+"|"+S.startY+"-"+S.startM;
 try{
   DATA=await fetchPortfolio(S);
   const live=await fetchFx();if(live)$("fx").value=Math.round(live*1000)/1000;
   STORAGE.set(STORE_KEY+"_data",JSON.stringify({sig,data:DATA,ts:Date.now()})).catch(()=>{});
   addSeen(PORT.map(p=>p.sym));
   $("offlineWarn").style.display="none";
   await compute();persist();
 }catch(e){
   let used=false;
   try{const c=await STORAGE.get(STORE_KEY+"_data");if(c){const o=JSON.parse(c);if(o&&o.data&&o.sig===sig){DATA=o.data;await compute();
     $("offlineWarn").style.display="";$("offlineWarn").textContent=L4("目前無法連線更新，顯示的是上次成功抓取的資料（"+new Date(o.ts).toLocaleString()+"）。有網路時會自動更新到最新。","Offline: showing last cached data ("+new Date(o.ts).toLocaleString()+"). Updates automatically when online.","オフライン：前回のデータを表示（"+new Date(o.ts).toLocaleString()+"）。","오프라인: 이전 데이터 표시.");used=true;}}}catch(_){}
   if(!used)alert(L4("讀取失敗：","Failed: ","失敗：","실패: ")+(e.message||e));
 }
 finally{btn.disabled=false;btn.textContent=old;}});

/* ================= 啟動 ================= */
(function(){const l=(navigator.language||"zh").toLowerCase();LG=l.startsWith("ja")?2:l.startsWith("ko")?3:(l.startsWith("zh")?0:1);})();
if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches){document.body.classList.add("dark");document.documentElement.classList.add("dark");}
applyS(DEF());
restore().then(()=>{applyLang();});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
