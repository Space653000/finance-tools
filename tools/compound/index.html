<style>
:root{
  --tint:#0A7C74; --amber:#B87410; --danger:#B93A25; --ok:#1F7A46;
  --bg:#F2F2F7; --card:#FFF;
  --label:#000; --label2:rgba(60,60,67,.78); --label3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.11); --fill2:rgba(120,120,128,.18);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --barbg:rgba(247,247,250,.96); --hh:112px;
}
body.dark{
  --tint:#3FA7A0; --amber:#E8A33D; --danger:#E2705A; --ok:#30D158;
  --bg:#000; --card:#1C1C1E;
  --label:#FFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.22); --fill2:rgba(120,120,128,.32);
  --shadow:0 1px 3px rgba(0,0,0,.4); --barbg:rgba(20,20,22,.96);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
html{background:#F2F2F7;color-scheme:light}
html.dark{background:#000;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang TC","Heiti TC","Microsoft JhengHei",
    "Hiragino Sans","Yu Gothic","Meiryo",
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK TC",sans-serif;
  background:var(--bg);color:var(--label);font-size:15px;line-height:1.5;
  font-feature-settings:"tnum" 1;padding-bottom:calc(56px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-wrap:break-word;
}
button,input,select{font:inherit;color:inherit;font-feature-settings:"tnum" 1;max-width:100%}
svg{display:block;max-width:100%}
header{position:sticky;top:0;z-index:50;background:var(--barbg);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hrow{max-width:1360px;margin:0 auto;padding:calc(9px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:6px}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.htxt span{display:block;font-size:11px;color:var(--label2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scrolled .htxt span{display:none}
@media(max-width:520px){.htxt span{display:none}}
.tbtn{background:var(--fill);border:none;border-radius:980px;padding:6px 10px;
  font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.tbtn:hover{background:var(--fill2)}
.tbtn.pri{background:var(--tint);color:#fff}
.tbtn:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
select.lang{background:var(--fill);border:none;border-radius:980px;padding:6px 8px;
  font-size:12.5px;font-weight:600;cursor:pointer;flex:none;color:var(--label)}
select option{background:var(--card);color:var(--label)}
.keyin{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:0 14px 9px;gap:12px}
.key{min-width:0}
.key + .key{border-left:.5px solid var(--sep);padding-left:12px}
.key .l{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.12;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .s{font-size:10.5px;color:var(--label2);margin-top:2px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:520px){.key .n{font-size:23px}}
main{max-width:1360px;margin:0 auto;padding:14px;display:grid;
  grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr);padding:12px}}
.col{display:grid;gap:13px;min-width:0}
@media(min-width:981px){.left{position:sticky;top:calc(var(--hh) + 12px);
  max-height:calc(100vh - var(--hh) - 26px);overflow-y:auto;overflow-x:hidden;padding-right:4px}}
.left::-webkit-scrollbar{width:6px}
.left::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.sec{font-size:12.5px;font-weight:600;color:var(--label2);padding:2px 4px 0;
  display:flex;align-items:center;gap:10px;min-width:0}
.sec button{background:none;border:none;color:var(--tint);font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;flex:none}
.sec .sp{margin-left:auto}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.f{padding:10px 14px}
.f + .f{border-top:.5px solid var(--sep)}
.ftop{display:flex;align-items:center;gap:7px;margin-bottom:6px;min-width:0}
.ftop label{font-size:13.5px;flex:1;min-width:0;line-height:1.3}
.info{width:19px;height:19px;border-radius:50%;background:var(--fill);border:none;
  color:var(--label2);font-size:11px;font-weight:700;cursor:pointer;flex:none;line-height:19px;text-align:center}
.num{width:96px;text-align:right;background:var(--fill);border:none;border-radius:8px;
  padding:5px 8px;font-size:15px;font-weight:600;-moz-appearance:textfield;flex:none}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:2px solid var(--tint)}
.u{font-size:12.5px;color:var(--label2);width:14px;text-align:left;flex:none}
.chip{background:var(--fill);color:var(--label2);font-size:11px;font-weight:600;
  padding:3px 7px;border-radius:980px;white-space:nowrap;flex:none}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-8px}
body.dark input[type=range]::-webkit-slider-thumb{background:#F2F2F7}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff}
input[type=range]:focus-visible{outline:2px solid var(--tint);outline-offset:4px;border-radius:6px}
.expl{font-size:12.5px;line-height:1.62;color:var(--label2);background:var(--fill);
  border-radius:9px;padding:9px 10px;margin-top:8px;display:none}
.expl.on{display:block}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 14px;min-width:0}
.seg button{flex:1;min-width:0;border:none;background:none;font-size:12.5px;font-weight:500;
  padding:7px 2px;border-radius:7px;cursor:pointer;color:var(--label);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16)}
body.dark .seg button.on{background:#48484A}
select.sel{background:var(--fill);border:none;border-radius:8px;padding:5px 7px;
  font-size:13px;font-weight:600;cursor:pointer;min-width:0;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;padding:9px 14px;min-height:44px;min-width:0}
.row + .row{border-top:.5px solid var(--sep)}
.row .k{font-size:13.5px;flex:1;min-width:0}
.sw{width:46px;height:28px;border-radius:980px;background:var(--fill2);border:none;
  position:relative;cursor:pointer;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
.layer{border-top:.5px solid var(--sep)}
.layer:first-child{border-top:none}
.lhead{display:flex;align-items:center;gap:7px;padding:10px 14px 7px;min-width:0}
.lhead select{flex:1;min-width:0}
.del{background:none;border:none;color:var(--danger);font-size:19px;cursor:pointer;padding:0 2px;line-height:1;flex:none}
.empty{padding:20px 14px;text-align:center;font-size:13.5px;color:var(--label2);line-height:1.65}
.warn{margin:0 14px 11px;padding:9px 10px;border-radius:9px;font-size:11.8px;line-height:1.6;
  background:rgba(184,116,16,.13);color:var(--amber);font-weight:500}
body.dark .warn{background:rgba(232,163,61,.14)}
.hero{padding:16px 16px 4px}
.conc{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.36}
.concs{font-size:13px;color:var(--label2);margin-top:7px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);margin-top:14px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats > div{padding:12px 6px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.stats > div:first-child{border-left:none}
@media(max-width:640px){.stats > div:nth-child(3){border-left:none}
  .stats > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.stats .n{font-size:21px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .l{font-size:10.5px;color:var(--label2);margin-top:3px}
.legend{display:flex;gap:13px;flex-wrap:wrap;padding:4px 16px 14px;font-size:11.5px;color:var(--label2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.reads{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.reads{grid-template-columns:repeat(2,1fr)}}
.reads > div{padding:13px 4px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.reads > div:first-child{border-left:none}
@media(max-width:640px){.reads > div:nth-child(3){border-left:none}
  .reads > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.reads .n{font-size:24px;font-weight:700;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reads .l{font-size:10.5px;color:var(--label2);margin-top:3px}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar{width:6px;height:6px}
.tw::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.tw.full{max-height:320px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;font-size:13px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;font-weight:600;color:var(--label2);border-bottom:.5px solid var(--sep);
  position:sticky;top:0;background:var(--card);z-index:1}
tbody tr + tr{border-top:.5px solid var(--sep)}
tr.gap td{color:var(--label2);font-size:12px;text-align:center;padding:6px}
td.v{font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:980px;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.exwrap{padding:0 14px 6px}
.exrow{display:flex;align-items:center;gap:6px;padding:6px 0;flex-wrap:wrap}
.exlab{font-size:12.5px;color:var(--label2);flex:none;min-width:60px}
.exn{width:56px;text-align:center;padding:6px 4px;font-size:14px}
.exa{width:80px;text-align:center;padding:6px 6px;font-size:14px}
.exu{font-size:12px;color:var(--label3);flex:none}
.exsel{min-width:64px}
.exnote{font-size:11.5px;color:var(--label2);line-height:1.55;padding:6px 0 2px}
.note{padding:10px 14px;font-size:12.3px;line-height:1.62;color:var(--label2);border-top:.5px solid var(--sep)}
.disc{font-size:11.8px;line-height:1.68;color:var(--label2);padding:6px 6px 0}
details > summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"›";margin-left:auto;color:var(--label3);font-size:18px;transform:rotate(90deg)}
details[open] > summary::after{transform:rotate(-90deg)}
.plan{padding:10px 14px;display:flex;align-items:center;gap:9px;min-width:0}
.plan + .plan{border-top:.5px solid var(--sep)}
.plan .pi{flex:1;min-width:0}
.plan .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .pm{font-size:11px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:22px;height:22px;border-radius:6px;border:1.8px solid var(--label3);background:none;
  cursor:pointer;flex:none;position:relative}
.cb.on{background:var(--tint);border-color:var(--tint)}
.cb.on::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:14px;font-weight:800;line-height:19px}
.mini{background:var(--fill);border:none;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.mini:hover{background:var(--fill2)}
.mini.d{color:var(--danger)}
.adv{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.adv + .adv{border-top:.5px solid var(--sep)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.adv .ac{flex:1;min-width:0}
.adv .at{font-size:13.5px;font-weight:600;line-height:1.42}
.adv .ad{font-size:12.3px;color:var(--label2);line-height:1.62;margin-top:4px}
.adv .mini{margin-top:8px}
.jur{margin:0 0 4px;padding:10px 12px;border-radius:10px;background:var(--fill);
  font-size:12px;line-height:1.6;color:var(--label2)}
body.busy #chMain,body.busy #gauge{opacity:.4;transition:opacity .12s}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htxt"><b id="hTitle">槓桿複利模擬器</b><span id="hSub"></span></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="0">繁體中文</option><option value="1">English</option>
      <option value="2">日本語</option><option value="3">한국어</option>
    </select>
    <button class="tbtn pri" id="save">存檔</button>
    <button class="tbtn" id="mode">深色</button>
    <button class="tbtn" id="reset">重設</button>
  </div>
  <div class="keyin">
    <div class="key"><div class="l" id="k1l">—</div><div class="n" id="k1n" style="color:var(--tint)">—</div><div class="s" id="k1s">—</div></div>
    <div class="key"><div class="l" id="k2l">—</div><div class="n" id="k2n">—</div><div class="s" id="k2s">—</div></div>
  </div>
</header>

<main>
  <div class="col left">
    <div class="jur" id="jur"></div>
    <div class="sec" id="s_mode"></div>
    <div class="card" style="padding:10px 0">
      <div class="seg" id="segMode"><button data-m="lump"></button><button data-m="dca"></button><button data-m="mix" class="on"></button></div>
      <div class="note" style="border-top:none;padding-bottom:2px" id="modeNote"></div>
    </div>
    <div class="sec" id="s_basic"><button class="sp" id="cons"></button></div>
    <div class="card" id="basic"></div>
    <div class="sec" id="s_debt"><button class="sp" id="addDebt"></button></div>
    <div class="card" id="debts"></div>
    <div class="sec" id="s_pers"></div>
    <div class="card" id="personal"></div>
    <div class="card"><details open><summary id="s_adv"></summary><div id="adv"></div></details></div>
    <div class="sec" id="s_plans"><span class="sp" style="font-weight:400;font-size:11px" id="planCount"></span></div>
    <div class="card" id="plans"></div>
    <div class="card"><details><summary id="s_hist"></summary><div id="hist"></div></details></div>
  </div>

  <div class="col">
    <div class="card">
      <div class="hero"><div class="conc" id="conc">—</div><div class="concs" id="concs">—</div></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="sec" id="s_advisor"><span class="sp" style="font-weight:400;font-size:11px" id="advCount"></span></div>
    <div class="card" id="advisor"></div>
    <div class="sec" id="s_chart"></div>
    <div class="card">
      <div style="padding:13px 4px 2px"><svg id="chMain" width="100%" height="248" viewBox="0 0 700 248" preserveAspectRatio="none"></svg></div>

      <div style="padding:2px 0 10px"><div class="seg" id="segSims">
        <button data-s="1000" class="on">1,000</button><button data-s="5000">5,000</button><button data-s="10000">10,000</button>
      </div></div>
      <div class="note" id="mcNote">—</div>
    </div>
    <div class="sec" id="s_gauge"></div>
    <div class="card">
      <div style="padding:10px 0 0"><svg id="gauge" width="100%" height="150" viewBox="0 0 380 150"></svg></div>
      <div class="reads" id="reads"></div>
      <div class="note" id="bNote">—</div>
    </div>
    <div class="sec" id="s_stress"></div>
    <div class="card"><div id="stress"></div><div class="note" id="stressNote"></div></div>
    <div class="sec" id="s_wf"></div>
    <div class="card">
      <div style="padding:13px 4px 4px"><svg id="chWf" width="100%" height="212" viewBox="0 0 700 212" preserveAspectRatio="none"></svg></div>
      <div class="note" id="wfNote">—</div>
    </div>
    <div class="sec" id="s_con"></div>
    <div class="card" id="constraints"></div>
    <div class="sec" id="cmpSec" style="display:none"></div>
    <div class="card" id="cmpCard" style="display:none">
      <div class="tw"><table id="cmpTbl"></table></div><div class="note" id="cmpNote"></div>
    </div>
    <div class="sec" id="s_tbl"></div>
    <div class="card">
      <div style="padding:10px 0"><div class="seg" id="segTbl">
        <button data-v="hide"></button><button data-v="brief" class="on"></button><button data-v="full"></button>
      </div></div>
      <div id="tblWrap"></div>
    </div>
    <p class="disc" id="disc"></p>
  </div>
</main>

<script>
"use strict";
/* ==================== 多語系 ==================== */
const LANG_CODES=["zh","en","ja","ko"];
let LG=0;
const D={
hSub:["單筆 × 定期定額 × 六種借款・即時運算","Lump sum × Recurring × 6 loan types · Live",
  "一括 × 積立 × 6種のローン・リアルタイム","거치식 × 적립식 × 6가지 대출 · 실시간"],
save:["存檔","Save","保存","저장"], dark:["深色","Dark","ダーク","다크"], light:["淺色","Light","ライト","라이트"],

cau:[
 ["券商辦理之不限用途款項借貸。利率多為機動，借款期間通常僅一年，到期需重新申請展延，券商有權不予展延或調整成數與維持率標準。擔保品市值下跌時會被要求補繳，未補足可能遭處分。",
  "Offered by brokers against your securities. Rates are usually floating and terms are typically one year, requiring renewal — the broker may decline to renew or change the loan-to-value and maintenance requirements. If collateral value falls you will be asked to top up, and unmet calls can lead to liquidation.",
  "証券会社が提供する有価証券担保ローン。金利は変動が多く、期間は通常1年で更新が必要です。証券会社は更新を拒否したり、掛目や維持率基準を変更したりできます。担保評価額が下落すると追証が発生し、対応できなければ強制決済となる可能性があります。",
  "증권사가 취급하는 유가증권 담보대출입니다. 금리는 대개 변동이며 기간은 통상 1년으로 만기 시 재연장이 필요합니다. 증권사는 연장을 거절하거나 담보인정비율·유지율 기준을 변경할 수 있습니다. 담보 가치가 하락하면 추가담보를 요구받으며, 충족하지 못하면 처분될 수 있습니다."],
 ["融資利率為所有借款中最高（市場常見約 6%–6.5%）。整戶擔保維持率低於 130% 將發出追繳通知，通常兩個營業日內未補繳即可能遭強制處分。上市股票融資成數約六成、上櫃約五成。",
  "The most expensive form of borrowing here (commonly around 6%–6.5% in Taiwan). If the account-level maintenance ratio falls below 130% a margin call is issued, and failure to meet it within roughly two business days can trigger forced liquidation.",
  "本ツールで扱う中で最も金利が高い借入です（台湾では概ね6%〜6.5%）。口座全体の担保維持率が130%を下回ると追証となり、概ね2営業日以内に対応できなければ強制決済となり得ます。",
  "여기서 다루는 대출 중 금리가 가장 높습니다(대만 기준 통상 6%~6.5%). 계좌 전체 담보유지율이 130% 미만이면 추가담보 통지가 발송되며, 통상 2영업일 내 대응하지 못하면 강제처분될 수 있습니다."],
 ["多為機動利率，央行升息時月付金會跟著增加。若設有寬限期，寬限期結束後月付金會明顯跳增，務必先確認屆時負擔得起。",
  "Usually a floating rate — payments rise when the central bank raises rates. If you take a grace period, the payment jumps noticeably once it ends; make sure you can afford that level.",
  "多くは変動金利で、利上げ時には毎月返済額が増えます。据置期間を設けた場合、終了後に返済額が大きく跳ね上がるため、その水準を負担できるか事前に確認してください。",
  "대부분 변동금리로 금리 인상 시 월 상환액이 늘어납니다. 거치 기간을 두면 종료 후 상환액이 크게 뛰므로 그 수준을 감당할 수 있는지 미리 확인하세요."],
 ["又稱回復型房貸，額度可隨借隨還、按日計息，但利率明顯高於一般房貸。動用即計息，部分銀行另設額度管理費。以住宅抵押借款投入股市，違約時可能失去自住房屋。",
  "A revolving credit line secured on your home. Interest accrues daily from the moment you draw, at a rate clearly above a standard mortgage, and some banks charge a facility fee. Investing money secured on your home means a default can cost you the home you live in.",
  "自宅を担保とする極度型のローンで、随時借入・返済が可能ですが、金利は通常の住宅ローンより明確に高く、引き出した時点から日割りで利息が発生します。自宅を担保に株式投資を行うと、返済不能時に居住する住宅を失う可能性があります。",
  "자택을 담보로 하는 한도형 대출로 수시 인출·상환이 가능하지만 금리는 일반 주택담보대출보다 확실히 높고, 인출 시점부터 일할 이자가 발생합니다. 자택을 담보로 주식에 투자하면 상환 불능 시 거주 주택을 잃을 수 있습니다."],
 ["無擔保借款，計入 DBR 22 倍上限。名目利率外通常另收開辦費，實際負擔的總費用年百分率（APR）高於名目利率。提前清償多有違約金，首年清償尤其常見。",
  "Unsecured, and counts toward the DBR 22× cap. An origination fee is usually charged on top of the headline rate, so the effective APR is higher than the nominal rate. Early repayment penalties are common, especially in the first year.",
  "無担保借入で、DBR22倍の上限に算入されます。表面金利のほかに事務手数料がかかるのが一般的で、実質年率（APR）は名目金利より高くなります。繰上返済には違約金が設定されていることが多く、特に初年度は一般的です。",
  "무담보 대출로 DBR 22배 상한에 산입됩니다. 표면금리 외에 취급수수료가 부과되는 것이 일반적이어서 실질연이율(APR)은 명목금리보다 높습니다. 중도상환 위약금이 흔하며 특히 첫해에 많습니다."],
 ["車輛折舊速度通常快於本金攤還速度，貸款期間前段常出現貸款餘額高於車輛殘值的情形。部分方案另收帳管費與手續費。",
  "Vehicles usually depreciate faster than the loan amortises, so early in the term the outstanding balance often exceeds the car's resale value. Some plans add servicing and handling fees.",
  "車両の減価償却は元金の返済より速いのが一般的で、期間の前半では残債が車両の残存価値を上回ることがよくあります。プランによっては管理手数料等が別途かかります。",
  "차량 감가상각이 원금 상환보다 빠른 것이 일반적이어서, 기간 전반에는 잔액이 차량 잔존가치를 웃도는 경우가 많습니다. 일부 상품은 관리·취급 수수료가 추가됩니다."]],
levWarn:["以借款投資屬槓桿操作。市場下跌時虧損會依槓桿倍數放大，利息仍須照常支付，可能造成損失超過原始本金。",
  "Investing borrowed money is leverage. Losses are amplified in a downturn, interest is still due regardless, and you can lose more than your original capital.",
  "借入金による投資はレバレッジ取引です。下落局面では損失が倍率分だけ拡大し、それでも利息は支払い続ける必要があり、当初元本を超える損失が生じる可能性があります。",
  "차입금 투자는 레버리지 거래입니다. 하락장에서 손실이 배수로 확대되고 이자는 계속 부담해야 하므로 원금을 초과하는 손실이 발생할 수 있습니다."],

bNote:["擔保維持率 = 擔保品市值 ÷ 借款金額。目前擔保借款 {d}，擔保品市值 {a}。有多筆擔保借款時，本工具保守採用其中最嚴格的門檻（追繳 {c}%、處分 {s}%）。「期間被追繳機率」為 {n} 條模擬路徑中，曾於任一時點跌破追繳線的比例。",
  "Margin ratio = collateral value ÷ loan amount. Current secured borrowing {d} against collateral of {a}. With multiple secured loans this tool conservatively applies the strictest thresholds ({c}% call, {s}% liquidation). “Margin call probability” is the share of {n} simulated paths that breached the call level at any point.",
  "担保維持率＝担保評価額÷借入額。現在の担保付借入は{d}、担保評価額は{a}です。複数の担保付借入がある場合、本ツールは最も厳しい基準（追証{c}%、強制決済{s}%）を保守的に適用します。「追証となる確率」は{n}本のパスのうち、いずれかの時点で追証水準を下回った割合です。",
  "담보유지율 = 담보평가액 ÷ 대출금액. 현재 담보대출 {d}, 담보평가액 {a}입니다. 담보대출이 여러 건이면 본 도구는 가장 엄격한 기준(추가담보 {c}%, 처분 {s}%)을 보수적으로 적용합니다. 「추가담보 요구 확률」은 {n}개 경로 중 어느 시점에라도 기준을 밑돈 비율입니다."],

function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();

function layerPmt(d){const i=d.rate/100/12,N=Math.max(1,Math.round(d.years*12));
  if(d.method==="interest")return d.amount*i;
  if(d.method==="grace"){if((d.grace||0)>0)return d.amount*i;
    return i===0?d.amount/N:d.amount*i/(1-Math.pow(1+i,-N));}
  if(d.method==="principal")return d.amount/N+d.amount*i;
  return i===0?d.amount/N:d.amount*i/(1-Math.pow(1+i,-N));}
function pmtAfterGrace(d){if(d.method!=="grace")return layerPmt(d);
  const i=d.rate/100/12,N=Math.max(1,Math.round(d.years*12)),g=Math.round((d.grace||0)*12),M=Math.max(1,N-g);
  return i===0?d.amount/M:d.amount*i/(1-Math.pow(1+i,-M));}
function stepLayer(d,bal,m){const i=d.rate/100/12,N=Math.max(1,Math.round(d.years*12));
  const g=d.method==="grace"?Math.round((d.grace||0)*12):0;
  if(bal<=0)return{int:0,prin:0,bal:0,extra:0};
  const it=bal*i;let pr=0;
  if(d.method==="interest"||(d.method==="grace"&&m<g))pr=(m>=N-1)?bal:0;
  else if(d.method==="principal")pr=Math.min(bal,d.amount/N);
  else{const M=d.method==="grace"?Math.max(1,N-g):N;
    const p=i===0?d.amount/M:d.amount*i/(1-Math.pow(1+i,-M));pr=Math.max(0,Math.min(bal,p-it));}
  if(m>=N-1)pr=bal;
  let rest=bal-pr,ex=0;
  // 額外還款：僅攤還型借款，於指定月繳完正常本息後一次性還本（月付金不變、提早還清）
  if(extraAllowed(d)&&Array.isArray(d.extra)){
    for(const e of d.extra){if(e&&Math.round(e.month)===m&&e.amount>0){
      const pay=Math.min(rest,e.amount);rest-=pay;ex+=pay;}}}
  return{int:it,prin:pr,bal:rest,extra:ex};}
// 哪些借款允許額外還款：僅會攤還本金者（房貸、理財房貸、信貸、車貸）
function extraAllowed(d){return d.method==="annuity"||d.method==="principal"||d.method==="grace";}
const divTaxRate=st=>st.divTax==="none"?0:st.divTax==="separate"?0.28:Math.max(0,st.bracket/100-0.085);
function rates(st){const ae=Math.pow(1+st.ret/100/st.freq,st.freq)-1,dv=st.divYield/100;
  return{priceM:Math.pow(Math.max(.01,1+ae-dv),1/12)-1,feeM:Math.pow(Math.max(.01,1-st.fee/100),1/12),divM:dv/12};}
const borrowedIn=st=>st.debts.reduce((s,d)=>s+(d.invest?d.amount:0),0);
const colDebt0=st=>st.debts.reduce((s,d)=>s+(DEBT_TYPES[d.type].collateral?d.amount:0),0);
const openFees=st=>st.debts.reduce((s,d)=>s+(d.fee||0),0);
function bindingLines(st){let c=0,s=0;st.debts.forEach(d=>{if(DEBT_TYPES[d.type].collateral){
  c=Math.max(c,d.call||DEBT_TYPES[d.type].call);s=Math.max(s,d.sell||DEBT_TYPES[d.type].sell);}});
  return{call:c||130,sell:s||120};}
function runDet(st){
  const M=Math.round(st.years*12),R=rates(st),uI=st.mode!=="dca",uM=st.mode!=="lump";
  let a=(uI?st.init:0)+borrowedIn(st),bals=st.debts.map(d=>d.amount);
  let own=uI?st.init:0,intP=0,prinP=0,feeP=0,taxP=0,nhiP=0;
  const path=[{m:0,assets:a,debt:bals.reduce((x,y)=>x+y,0),own}];
  for(let m=0;m<M;m++){
    const b0=a;a=a*(1+R.priceM);const f=a*(1-R.feeM);feeP+=f;a-=f;
    const dv=b0*R.divM,tx=dv*divTaxRate(st);taxP+=tx;
    const nh=(st.nhi&&dv*12>=20000)?dv*0.0211:0;nhiP+=nh;
    a+=dv-tx-nh;
    if(uM){const c=st.monthly*Math.pow(1+st.stepUp/100,Math.floor(m/12));a+=c;own+=c;}
    st.debts.forEach((d,k)=>{const r=stepLayer(d,bals[k],m);bals[k]=r.bal;intP+=r.int;prinP+=r.prin+(r.extra||0);});
    if((m+1)%12===0||m===M-1)path.push({m:m+1,assets:a,debt:bals.reduce((x,y)=>x+y,0),own});}
  const de=bals.reduce((x,y)=>x+y,0);
  return{path,assets:a,debtEnd:de,net:a-de,ownIn:own,intP,prinP,feeP,taxP,nhiP,
    firstPay:st.debts.reduce((s,d)=>s+layerPmt(d),0),borrowed:borrowedIn(st),openFee:openFees(st)};}
function runMC(st,N){
  N=N||SIMS;const M=Math.round(st.years*12),R=rates(st);
  const sm=(st.vol/100)/Math.sqrt(12),mu=Math.log(1+R.priceM)-sm*sm/2;
  const uI=st.mode!=="dca",uM=st.mode!=="lump";
  const a0=(uI?st.init:0)+borrowedIn(st),L=bindingLines(st),call=L.call/100;
  const ci=st.debts.map((d,i)=>DEBT_TYPES[d.type].collateral?i:-1).filter(i=>i>=0);
  const yrs=Math.floor(M/12),snap=Array.from({length:yrs+1},()=>[]),fin=[];
  let hitN=0;const rnd=mulberry32(20260801);
  for(let p=0;p<N;p++){
    let a=a0,bals=st.debts.map(d=>d.amount),hit=false;
    snap[0].push(a-bals.reduce((x,y)=>x+y,0));
    for(let m=0;m<M;m++){
      const b0=a;a=a*Math.exp(mu+sm*gauss(rnd))*R.feeM;
      const dv=b0*R.divM;
      a+=dv-dv*divTaxRate(st)-(st.nhi&&dv*12>=20000?dv*0.0211:0);
      if(a<0)a=0;
      if(uM)a+=st.monthly*Math.pow(1+st.stepUp/100,Math.floor(m/12));
      st.debts.forEach((d,k)=>{bals[k]=stepLayer(d,bals[k],m).bal;});
      if(!hit&&ci.length){const cd=ci.reduce((s,i)=>s+bals[i],0);if(cd>0&&a/cd<call)hit=true;}
      if((m+1)%12===0){const y=(m+1)/12;if(snap[y])snap[y].push(a-bals.reduce((x,z)=>x+z,0));}}
    if(hit)hitN++;fin.push(a-bals.reduce((x,y)=>x+y,0));}
  const q=(arr,p)=>{const s=[...arr].sort((x,y)=>x-y);return s[clamp(Math.floor(p*(s.length-1)),0,s.length-1)];};
  return{band:snap.map(x=>({p10:q(x,.1),p50:q(x,.5),p90:q(x,.9)})),
    p10:q(fin,.1),p50:q(fin,.5),p90:q(fin,.9),callProb:ci.length?hitN/N:null};}
function boundary(st,det){
  const cd=colDebt0(st),a0=(st.mode!=="dca"?st.init:0)+borrowedIn(st);
  if(cd<=0||a0<=0)return null;
  const L=bindingLines(st);
  return{ratio:a0/cd*100,toCall:(1-(L.call/100)*cd/a0)*100,toSell:(1-(L.sell/100)*cd/a0)*100,
    months:det.firstPay>0?st.cash/det.firstPay:Infinity,cd,a0,call:L.call,sell:L.sell};}

const A_=(k,i)=>((AD[k]&&AD[k][LG])||AD[k][0])[i];
function fill(s,v){for(const p in v)s=s.split("{"+p+"}").join(v[p]);return s;}
function advisories(det,mc,bd){
  const A=[],P=(k,lv,v,f)=>{const t=A_(k,0),d=A_(k,1),a=A_(k,2);
    A.push({lv,t:fill(t,v||{}),d:fill(d,v||{}),a:a?fill(a,v||{}):"",f});};
  if(S.ret>8)P("retHi",2,{r:S.ret},()=>{S.ret=6;});
  if(S.vol<12)P("volLo",2,{v:S.vol},()=>{S.vol=20;});
  if(S.infl===0)P("inflZ",1,{},()=>{S.infl=2;});
  if(S.fee===0)P("feeZ",1,{},()=>{S.fee=0.45;});
  if(S.divTax==="none"&&S.divYield>0)P("taxZ",1,{},()=>{S.divTax="combined";});
  if(bd&&det.firstPay>0&&bd.months<6){const a=Math.ceil(det.firstPay*6/10000)*10000;
    P("cashLo",3,{m:Math.floor(bd.months),a:wan(a)},()=>{S.cash=a;});}
  const r=S.income>0?det.firstPay/S.income*100:0;
  if(r>40)P("payHi",3,{r:r.toFixed(1)});
  const unsec=S.debts.filter(d=>!DEBT_TYPES[d.type].secured).reduce((s,d)=>s+d.amount,0);
  if(S.income>0&&unsec/S.income>22)P("dbrHi",3,{u:wan(unsec),x:(unsec/S.income).toFixed(1)});
  if(bd&&mc.callProb>0.25)P("callHi",3,{p:(mc.callProb*100).toFixed(0)},
    ()=>{S.debts.forEach(d=>{if(DEBT_TYPES[d.type].collateral)d.amount=Math.round(d.amount*0.7/100000)*100000;});});
  const sp=S.debts.filter(d=>d.type==="pledge"&&d.years<S.years);
  if(sp.length)P("pledgeShort",2,{d:sp[0].years,y:S.years});
  const gr=S.debts.filter(d=>d.method==="grace"&&(d.grace||0)>0);
  if(gr.length){const n=layerPmt(gr[0]),af=pmtAfterGrace(gr[0]);
    P("graceJump",2,{a:money(n),b:money(af),c:money(af-n)});}
  const lev=S.debts.filter(d=>d.invest).reduce((s,d)=>s+d.amount,0);
  const oc=S.mode!=="dca"?S.init:0;
  if(lev>0&&oc>0&&lev/oc>1)P("levHi",3,{l:wan(lev),o:wan(oc),
    x:(1+lev/oc).toFixed(1),d:(100/(1+lev/oc)).toFixed(0)});
  if(S.debts.some(d=>d.type==="heloc"&&d.invest))P("homeRisk",3);
  if(!A.length)P("ok",0);
  return A.sort((a,b)=>b.lv-a.lv);}

function field(k,lk,min,max,step,unit,chip){const v=S[k];
  return `<div class="f"><div class="ftop"><label for="i_${k}">${T(lk)}</label>

    <span class="u">${unit||""}</span>${chip?`<span class="chip" id="c_${k}">${chip(v)}</span>`:""}</div>
    <input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${T(lk)}">
    ${EX[k]?`<div class="expl" id="x_${k}">${EX[k][LG]||EX[k][0]}</div>`:""}</div>`;}
function dfield(i,p,lk,min,max,step,unit,val){

/* ==================== 圖表 ==================== */
const NS="http://www.w3.org/2000/svg";
const cv=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o){const e=mk("text",Object.assign({x,y,fill:cv("--label2"),"font-size":11},o||{}));e.textContent=s;return e;}
function drawMain(det,mc){
  const s=$("chMain");s.innerHTML="";
  const W=700,H=248,L=62,R=12,T0=12,B=24,w=W-L-R,h=H-T0-B,yrs=S.years;
  const vals=[];mc.band.forEach(b=>vals.push(b.p10,b.p90));
  det.path.forEach(p=>vals.push(p.assets,p.own,-p.debt));
  let max=Math.max(...vals,1),min=Math.min(...vals,0);
  const pd=(max-min)*.08;max+=pd;min-=pd;
  const X=i=>L+w*i/Math.max(1,yrs),Y=v=>T0+h-((v-min)/(max-min))*h;
  for(let g=0;g<=4;g++){const gy=T0+h*g/4;
    s.appendChild(mk("line",{x1:L,y1:gy,x2:L+w,y2:gy,stroke:cv("--sep"),"stroke-width":.6}));
    s.appendChild(tx(L-6,gy+4,wan(max-(max-min)*g/4),{"text-anchor":"end","font-size":9.5}));}
  if(min<0&&max>0)s.appendChild(mk("line",{x1:L,y1:Y(0),x2:L+w,y2:Y(0),stroke:cv("--label3"),"stroke-width":1}));
  const n=mc.band.length-1;
  let d="M"+X(0)+" "+Y(mc.band[0].p10);
  for(let i=1;i<=n;i++)d+="L"+X(i)+" "+Y(mc.band[i].p10);
  for(let j=n;j>=0;j--)d+="L"+X(j)+" "+Y(mc.band[j].p90);
  s.appendChild(mk("path",{d:d+"Z",fill:cv("--tint"),opacity:.2}));
  let dd="M"+X(0)+" "+Y(0);det.path.forEach(p=>dd+="L"+X(p.m/12)+" "+Y(-p.debt));
  s.appendChild(mk("path",{d:dd+"L"+X(yrs)+" "+Y(0)+"Z",fill:cv("--danger"),opacity:.2}));
  let dc="M"+X(0)+" "+Y(det.path[0].own);det.path.forEach(p=>dc+="L"+X(p.m/12)+" "+Y(p.own));
  s.appendChild(mk("path",{d:dc,fill:"none",stroke:cv("--label3"),"stroke-width":1.6,"stroke-dasharray":"5 4"}));
  let dm="M"+X(0)+" "+Y(mc.band[0].p50);
  for(let i=1;i<=n;i++)dm+="L"+X(i)+" "+Y(mc.band[i].p50);
  s.appendChild(mk("path",{d:dm,fill:"none",stroke:cv("--tint"),"stroke-width":2.8,"stroke-linejoin":"round","stroke-linecap":"round"}));
  s.appendChild(mk("circle",{cx:X(n),cy:Y(mc.band[n].p50),r:4,fill:cv("--tint")}));
  const yl=[T("thYear"),"y","年","년"][LG]||"";
  [0,Math.round(yrs/2),yrs].forEach((m,k)=>s.appendChild(tx(X(m),H-6,LG===1?m+"y":m+" "+yl,
    {"text-anchor":k===0?"start":(k===2?"end":"middle"),"font-size":10})));}
function drawGauge(bd){
  const s=$("gauge");s.innerHTML="";
  if(!bd){s.appendChild(tx(190,68,T("gNone"),{"text-anchor":"middle","font-size":13,fill:cv("--label2")}));
    s.appendChild(tx(190,90,T("gNone2"),{"text-anchor":"middle","font-size":10.5}));return;}
  const cx=190,cy=126,r=92,tw=16,lo=100,hi=260;
  const toA=v=>180-((clamp(v,lo,hi)-lo)/(hi-lo))*180;
  const pt=a=>{const q=a*Math.PI/180;return[cx+r*Math.cos(q),cy-r*Math.sin(q)];};
  const arc=(v1,v2,c)=>{const p1=pt(toA(v1)),p2=pt(toA(v2));
    s.appendChild(mk("path",{d:`M${p1[0]} ${p1[1]}A${r} ${r} 0 0 1 ${p2[0]} ${p2[1]}`,fill:"none",stroke:c,"stroke-width":tw}));};
  arc(lo,bd.sell,cv("--danger"));arc(bd.sell,bd.call,cv("--amber"));arc(bd.call,hi,cv("--tint"));
  const np=pt(toA(bd.ratio));
  s.appendChild(mk("line",{x1:cx,y1:cy,x2:np[0],y2:np[1],stroke:cv("--label"),"stroke-width":3.2,"stroke-linecap":"round"}));
  s.appendChild(mk("circle",{cx,cy,r:6.5,fill:cv("--label")}));
  const col=bd.ratio<bd.sell?cv("--danger"):(bd.ratio<bd.call?cv("--amber"):cv("--tint"));

function drawWf(det){
  const s=$("chWf");s.innerHTML="";
  const W=700,H=212,L=8,R=8,T0=24,B=40,w=W-L-R,h=H-T0-B;
  const nm=j=>TA("wf",j);
  const items=[{n:nm(0),v:det.ownIn,c:cv("--label3")},{n:nm(1),v:det.borrowed,c:"#8FA3B8"},
    {n:nm(2),v:det.assets-det.ownIn-det.borrowed+det.feeP+det.taxP+det.nhiP,c:cv("--tint")},
    {n:nm(3),v:-det.feeP,c:cv("--amber")},{n:nm(4),v:-det.taxP,c:cv("--amber")},
    {n:nm(5),v:-det.nhiP,c:cv("--amber")},{n:nm(6),v:-det.intP,c:cv("--danger")},
    {n:nm(7),v:-det.openFee,c:cv("--danger")},{n:nm(8),v:-det.debtEnd,c:cv("--danger")}];
  let run=0;const st=items.map(it=>{const a=run;run+=it.v;return{...it,a,b:run};});
  const fv=run,vals=st.flatMap(x=>[x.a,x.b]).concat([0,fv]);
  let max=Math.max(...vals),min=Math.min(...vals,0);
  const pd=(max-min)*.1||1;max+=pd;min-=pd*.3;
  const Y=v=>T0+h-((v-min)/(max-min))*h;
  const gw=w/(st.length+1),bw=gw*.6;
  s.appendChild(mk("line",{x1:L,y1:Y(0),x2:L+w,y2:Y(0),stroke:cv("--sep"),"stroke-width":1}));
  st.forEach((x0,i)=>{const x=L+gw*i+(gw-bw)/2,y1=Y(Math.max(x0.a,x0.b)),hh=Math.max(2,Y(Math.min(x0.a,x0.b))-y1);
    s.appendChild(mk("rect",{x,y:y1,width:bw,height:hh,rx:3,fill:x0.c,opacity:.9}));
    if(Math.abs(x0.v)>1)s.appendChild(tx(x+bw/2,y1-5,(x0.v>=0?"+":"−")+wan(Math.abs(x0.v)),{"text-anchor":"middle","font-size":8.5,"font-weight":600}));
    s.appendChild(tx(x+bw/2,H-22,x0.n,{"text-anchor":"middle","font-size":8.5}));
    if(i<st.length-1)s.appendChild(mk("line",{x1:x+bw,y1:Y(x0.b),x2:x+gw+(gw-bw)/2,y2:Y(x0.b),stroke:cv("--label3"),"stroke-width":1,"stroke-dasharray":"3 3"}));});
  const fx=L+gw*st.length+(gw-bw)/2,fy=Y(Math.max(0,fv)),fh=Math.max(2,Math.abs(Y(fv)-Y(0)));
  s.appendChild(mk("rect",{x:fx,y:fy,width:bw,height:fh,rx:3,fill:fv>=0?cv("--tint"):cv("--danger")}));
  s.appendChild(tx(fx+bw/2,fy-5,wan(fv),{"text-anchor":"middle","font-size":10,"font-weight":700,fill:cv("--label")}));
  s.appendChild(tx(fx+bw/2,H-22,TA("wf",9),{"text-anchor":"middle","font-size":8.5,"font-weight":700,fill:cv("--label")}));
  s.appendChild(tx(L,12,T("wfUnit"),{"font-size":9.5,fill:cv("--label3")}));}

function metaOf(st){const m=[T("mLump"),T("mDca"),T("mMix")][["lump","dca","mix"].indexOf(st.mode)];
  const d=st.debts.length?st.debts.map(x=>TA("dtS",DEBT_TYPES[x.type].i)+" "+wan(x.amount)).join("・"):"—";
  return `${m}・${st.years}${LG===1?"y":""}・${st.ret}%・${d}`;}
function autoName(st){const p=[];
  if(st.mode!=="dca")p.push(T("fInit")+" "+wan(st.init));
  if(st.mode!=="lump")p.push(T("fMonthly")+" "+wan(st.monthly));
  p.push(st.years+(LG===1?"y":[" 年","","年","년"][LG]));
  if(st.debts.length)p.push(T("sDebt")+" "+wan(st.debts.reduce((s,d)=>s+d.amount,0)));
  return p.join("・");}

  const rows=[[T("fYears"),r=>r.st.years],[T("fRet"),r=>r.st.ret+"%"],
    [T("thOwn"),r=>wan(r.det.ownIn)],[T("sDebt"),r=>wan(r.st.debts.reduce((s,d)=>s+d.amount,0))],
    [T("stNet"),r=>wan(r.mc.p50)],[T("kP10"),r=>wan(r.mc.p10)],
    [T("stReal"),r=>wan(r.mc.p50/Math.pow(1+r.st.infl/100,r.st.years))],
    [T("stCost"),r=>wan(r.det.intP+r.det.feeP+r.det.taxP+r.det.nhiP+r.det.openFee)],
    [T("mPay"),r=>money(r.det.firstPay)],
    [T("kPayR"),r=>r.st.income>0?(r.det.firstPay/r.st.income*100).toFixed(1)+"%":"—"],
    [T("gRatio"),r=>r.bd?Math.round(r.bd.ratio)+"%":"—"],
    [T("rCall"),r=>r.bd?(r.bd.toCall>0?"−"+r.bd.toCall.toFixed(0)+"%":T("hit")):"—"],
    [T("rProb"),r=>r.bd?(r.mc.callProb*100).toFixed(0)+"%":"—"],
    ["2008 (−58%)",r=>{if(!r.bd)return "—";const a=r.bd.a0*.42/r.bd.cd*100;
      return a<r.bd.sell?T("vLiq"):(a<r.bd.call?T("vCall"):T("vOk")+" "+Math.round(a)+"%");}]];
  let h=`<thead><tr><th></th>${R.map(r=>`<th>${r.p.name}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(([k,f])=>{h+=`<tr><td>${k}</td>${R.map(r=>`<td class="v">${f(r)}</td>`).join("")}</tr>`;});
  $("cmpTbl").innerHTML=h+"</tbody>";$("cmpNote").textContent=T("cmpNote");}
