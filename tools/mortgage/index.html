<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房貸試算</title>
<meta name="description" content="房貸試算：本息／本金／寬限期／多段利率、實質 APR、升息壓力測試、提前還款、轉貸回本、買vs租、房地合一稅、指數型利率蒙地卡羅。四語系、深淺色、本地運算不外傳。">
<meta name="theme-color" content="#0A7C74">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --tint:#0A7C74; --amber:#B87410; --danger:#B93A25; --ok:#1F7A46;
  --bg:#F2F2F7; --card:#FFF;
  --label:#000; --label2:rgba(60,60,67,.78); --label3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.11); --fill2:rgba(120,120,128,.18);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --barbg:rgba(247,247,250,.96); --hh:112px;
}
body.dark{
  --tint:#3FA7A0; --amber:#E8A33D; --danger:#E2705A; --ok:#30D158;
  --bg:#000; --card:#1C1C1E;
  --label:#FFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.22); --fill2:rgba(120,120,128,.32);
  --shadow:0 1px 3px rgba(0,0,0,.4); --barbg:rgba(20,20,22,.96);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
html{background:#F2F2F7;color-scheme:light}
html.dark{background:#000;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang TC","Heiti TC","Microsoft JhengHei","Hiragino Sans","Yu Gothic","Meiryo",
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK TC",sans-serif;
  background:var(--bg);color:var(--label);font-size:15px;line-height:1.5;
  font-feature-settings:"tnum" 1;padding-bottom:56px;overflow-wrap:break-word;
}
button,input,select{font:inherit;color:inherit;font-feature-settings:"tnum" 1;max-width:100%}
select option{background:var(--card);color:var(--label)}
svg{display:block;max-width:100%}
header{position:sticky;top:0;z-index:50;background:var(--barbg);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hrow{max-width:1360px;margin:0 auto;padding:9px 14px 8px;display:flex;align-items:center;gap:6px}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.htxt span{display:block;font-size:11px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.scrolled .htxt span{display:none}
@media(max-width:520px){.htxt span{display:none}}
.tbtn{background:var(--fill);border:none;border-radius:980px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.tbtn:hover{background:var(--fill2)}
.tbtn.pri{background:var(--tint);color:#fff}
.tbtn:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
select.lang{background:var(--fill);border:none;border-radius:980px;padding:6px 8px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.keyin{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:0 14px 9px;gap:12px}
.key{min-width:0}
.key + .key{border-left:.5px solid var(--sep);padding-left:12px}
.key .l{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.12;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .s{font-size:10.5px;color:var(--label2);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:520px){.key .n{font-size:23px}}
main{max-width:1360px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr);padding:12px}}
.col{display:grid;gap:13px;min-width:0}
@media(min-width:981px){.left{position:sticky;top:calc(var(--hh) + 12px);max-height:calc(100vh - var(--hh) - 26px);overflow-y:auto;overflow-x:hidden;padding-right:4px}}
.left::-webkit-scrollbar{width:6px}
.left::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.sec{font-size:12.5px;font-weight:600;color:var(--label2);padding:2px 4px 0;display:flex;align-items:center;gap:10px;min-width:0}
.sec button{background:none;border:none;color:var(--tint);font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;flex:none}
.sec .sp{margin-left:auto}
.grp{margin:12px 2px 2px;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,var(--fill),transparent);border:.5px solid var(--sep)}
.grp:first-child{margin-top:0}
.grp b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--label)}
.grp span{display:block;font-size:11.5px;color:var(--label2);margin-top:3px;line-height:1.5}
.grp.opt{background:linear-gradient(180deg,rgba(10,124,116,.10),transparent)}
body.dark .grp.opt{background:linear-gradient(180deg,rgba(63,167,160,.14),transparent)}
.grp.opt b::before{content:"⌥ ";color:var(--tint)}
.optcard{position:relative}
.optcard.off{opacity:.72}
.optbadge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--tint);background:var(--fill);border-radius:980px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.f{padding:10px 14px}
.f + .f{border-top:.5px solid var(--sep)}
.ftop{display:flex;align-items:center;gap:7px;margin-bottom:6px;min-width:0}
.ftop label{font-size:13.5px;flex:1;min-width:0;line-height:1.3}
.info{width:19px;height:19px;border-radius:50%;background:var(--fill);border:none;color:var(--label2);font-size:11px;font-weight:700;cursor:pointer;flex:none;line-height:19px;text-align:center}
.num{width:104px;text-align:right;background:var(--fill);border:none;border-radius:8px;padding:5px 8px;font-size:15px;font-weight:600;-moz-appearance:textfield;flex:none}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:2px solid var(--tint)}
.u{font-size:12.5px;color:var(--label2);width:26px;text-align:left;flex:none}
.chip{background:var(--fill);color:var(--label2);font-size:11px;font-weight:600;padding:3px 7px;border-radius:980px;white-space:nowrap;flex:none}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-8px}
body.dark input[type=range]::-webkit-slider-thumb{background:#F2F2F7}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff}
.expl{font-size:12.5px;line-height:1.62;color:var(--label2);background:var(--fill);border-radius:9px;padding:9px 10px;margin-top:8px;display:none}
.expl.on{display:block}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 14px;min-width:0;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:none;background:none;font-size:12.5px;font-weight:500;padding:7px 2px;border-radius:7px;cursor:pointer;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16)}
body.dark .seg button.on{background:#48484A}
select.sel{background:var(--fill);border:none;border-radius:8px;padding:5px 7px;font-size:13px;font-weight:600;cursor:pointer;min-width:0;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;padding:9px 14px;min-height:44px;min-width:0}
.row + .row{border-top:.5px solid var(--sep)}
.row .k{font-size:13.5px;flex:1;min-width:0}
.sw{width:46px;height:28px;border-radius:980px;background:var(--fill2);border:none;position:relative;cursor:pointer;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
.layer{border-top:.5px solid var(--sep)}
.layer:first-child{border-top:none}
.lhead{display:flex;align-items:center;gap:7px;padding:10px 14px 4px;min-width:0}
.lhead .lt{flex:1;min-width:0;font-size:13px;font-weight:600}
.del{background:none;border:none;color:var(--danger);font-size:19px;cursor:pointer;padding:0 2px;line-height:1;flex:none}
.empty{padding:18px 14px;text-align:center;font-size:13px;color:var(--label2);line-height:1.65}
.warn{margin:0 14px 11px;padding:9px 10px;border-radius:9px;font-size:11.8px;line-height:1.6;background:rgba(184,116,16,.13);color:var(--amber);font-weight:500}
body.dark .warn{background:rgba(232,163,61,.14)}
.hero{padding:16px 16px 4px}
.conc{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.36}
.concs{font-size:13px;color:var(--label2);margin-top:7px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);margin-top:14px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats > div{padding:12px 6px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.stats > div:first-child{border-left:none}
@media(max-width:640px){.stats > div:nth-child(3){border-left:none}.stats > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.stats .n{font-size:20px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .l{font-size:10.5px;color:var(--label2);margin-top:3px}
.reads{display:grid;grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.reads{grid-template-columns:repeat(2,1fr)}}
.reads > div{padding:13px 4px;text-align:center;border-left:.5px solid var(--sep);min-width:0}
.reads > div:first-child{border-left:none}
@media(max-width:640px){.reads > div:nth-child(3){border-left:none}.reads > div:nth-child(n+3){border-top:.5px solid var(--sep)}}
.reads .n{font-size:22px;font-weight:700;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reads .l{font-size:10.5px;color:var(--label2);margin-top:3px}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar{width:6px;height:6px}
.tw::-webkit-scrollbar-thumb{background:var(--sep);border-radius:6px}
.tw.full{max-height:340px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;font-size:13px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;font-weight:600;color:var(--label2);border-bottom:.5px solid var(--sep);position:sticky;top:0;background:var(--card);z-index:1}
tbody tr + tr{border-top:.5px solid var(--sep)}
tr.gap td{color:var(--label2);font-size:12px;text-align:center;padding:6px}
td.v{font-weight:600}
.note{padding:10px 14px;font-size:12.3px;line-height:1.62;color:var(--label2);border-top:.5px solid var(--sep)}
.disc{font-size:11.8px;line-height:1.68;color:var(--label2);padding:6px 6px 0}
details > summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"›";margin-left:auto;color:var(--label3);font-size:18px;transform:rotate(90deg)}
details[open] > summary::after{transform:rotate(-90deg)}
.adv{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.adv + .adv{border-top:.5px solid var(--sep)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.adv .ac{flex:1;min-width:0}
.adv .at{font-size:13.5px;font-weight:600;line-height:1.42}
.adv .ad{font-size:12.3px;color:var(--label2);line-height:1.62;margin-top:4px}
.jur{margin:0 0 4px;padding:10px 12px;border-radius:10px;background:var(--fill);font-size:12px;line-height:1.6;color:var(--label2)}
.tag{display:inline-block;padding:2px 8px;border-radius:980px;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.mini{background:var(--fill);border:none;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.mini:hover{background:var(--fill2)}
.dm{padding:10px 14px;display:flex;align-items:center;gap:8px}
.dm + .dm{border-top:.5px solid var(--sep)}
.dm .dk{font-size:13px;flex:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htxt"><b id="hTitle">房貸試算</b><span id="hSub"></span></div>
    <select class="lang" id="lang" aria-label="Language">
      <option value="0">繁體中文</option><option value="1">English</option>
      <option value="2">日本語</option><option value="3">한국어</option>
    </select>
    <button class="tbtn pri" id="save">＋存方案</button>
    <button class="tbtn" id="savefile">存檔</button>
    <button class="tbtn" id="mode">深色</button>
    <button class="tbtn" id="reset">重設</button>
  </div>
  <div class="keyin">
    <div class="key"><div class="l" id="k1l">—</div><div class="n" id="k1n" style="color:var(--tint)">—</div><div class="s" id="k1s">—</div></div>
    <div class="key"><div class="l" id="k2l">—</div><div class="n" id="k2n">—</div><div class="s" id="k2s">—</div></div>
  </div>
</header>

<main>
  <div class="col left">
    <div class="jur" id="jur"></div>

    <div class="grp" id="grpMain"></div>

    <div class="sec" id="s_basic"></div>
    <div class="card" id="basic"></div>

    <div class="sec" id="s_rate"><button class="sp" id="addSeg"></button></div>
    <div class="card" id="rateCard"></div>

    <div class="sec" id="s_method"></div>
    <div class="card" id="methodCard"></div>

    <div class="sec" id="s_extra"></div>
    <div class="card" id="extraCard"></div>

    <div class="sec" id="s_you"></div>
    <div class="card" id="youCard"></div>

    <div class="grp opt" id="grpOpt"></div>

    <div class="sec" id="s_refi"></div>
    <div class="card optcard" id="refiCard"></div>
    <div class="sec" id="s_rvb"></div>
    <div class="card optcard" id="rvbCard"></div>
    <div class="sec" id="s_sell"></div>
    <div class="card optcard" id="sellCard"></div>
    <div class="sec" id="s_mc"></div>
    <div class="card optcard" id="mcInputs"></div>
  </div>

  <div class="col">
    <div class="card">
      <div class="hero"><div class="conc" id="conc">—</div><div class="concs" id="concs">—</div></div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="sec" id="s_grace" style="display:none"></div>
    <div class="card" id="graceCard" style="display:none"></div>

    <div class="sec" id="s_plans"><button class="sp" id="clearPlans"></button></div>
    <div class="card" id="plansCard"></div>

    <div class="sec" id="s_advisor"><span class="sp" style="font-weight:400;font-size:11px" id="advCount"></span></div>
    <div class="card" id="advisor"></div>

    <div class="sec" id="s_cond"><span class="sp" style="font-weight:400;font-size:11px" id="condCount"></span></div>
    <div class="card" id="condCard"></div>

    <div class="sec" id="s_chart"></div>
    <div class="card">
      <div style="padding:13px 4px 2px"><svg id="chAmort" width="100%" height="220" viewBox="0 0 700 220" preserveAspectRatio="none"></svg></div>
      <div class="note" id="chartNote">—</div>
    </div>

    <div class="sec" id="s_cost"></div>
    <div class="card">
      <div style="padding:13px 4px 4px"><svg id="chWf" width="100%" height="200" viewBox="0 0 700 200" preserveAspectRatio="none"></svg></div>
      <div class="reads" id="costReads"></div>
      <div class="note" id="costNote">—</div>
    </div>

    <div class="sec" id="s_compare"></div>
    <div class="card"><div class="tw"><table id="cmpTbl"></table></div><div class="note" id="cmpNote"></div></div>

    <div class="sec" id="s_stress"></div>
    <div class="card"><div class="tw"><table id="stressTbl"></table></div><div class="note" id="stressNote"></div></div>

    <div class="sec" id="s_prepay"></div>
    <div class="card"><div class="reads" id="prepayReads"></div><div class="note" id="prepayNote"></div></div>

    <div class="sec" id="s_refiOut" style="display:none"></div>
    <div class="card" id="refiOutCard" style="display:none"><div class="reads" id="refiReads"></div><div class="note" id="refiNote"></div></div>

    <div class="sec" id="s_rvbOut" style="display:none"></div>
    <div class="card" id="rvbOutCard" style="display:none">
      <div style="padding:13px 4px 2px"><svg id="chRvb" width="100%" height="200" viewBox="0 0 700 200" preserveAspectRatio="none"></svg></div>
      <div class="reads" id="rvbReads"></div><div class="note" id="rvbNote"></div>
    </div>

    <div class="sec" id="s_sellOut" style="display:none"></div>
    <div class="card" id="sellOutCard" style="display:none"><div class="reads" id="sellReads"></div><div class="note" id="sellNote"></div></div>

    <div class="sec" id="s_mcOut"></div>
    <div class="card">
      <div style="padding:2px 0 6px"><div class="seg" id="segSims">
        <button data-s="1000">1,000</button><button data-s="10000" class="on">10,000</button><button data-s="100000">100,000</button>
      </div></div>
      <div class="reads" id="mcReads"></div><div class="note" id="mcNote">—</div>
    </div>

    <div class="sec" id="s_reg"></div>
    <div class="card"><div class="tw"><table id="regTbl"></table></div><div class="note" id="regNote"></div></div>

    <div class="sec" id="s_tbl"></div>
    <div class="card">
      <div style="padding:10px 0"><div class="seg" id="segTbl">
        <button data-v="hide"></button><button data-v="brief" class="on"></button><button data-v="full"></button>
      </div></div>
      <div id="tblWrap"></div>
    </div>

    <div class="sec" id="s_data"></div>
    <div class="card" id="dataCard"></div>

    <p class="disc" id="disc"></p>
  </div>
</main>

<script src="engine.js"></script>
<script>
"use strict";
const E = window.MortgageEngine;
const LANG_CODES=["zh","en","ja","ko"]; let LG=0;

/* ==================== 多語系 ==================== */
const D={
hSub:["本息／本金／寬限／多段利率・實質APR・壓力測試・提前還款・轉貸・買vs租・房地合一稅",
 "Amortization · real APR · stress test · prepay · refinance · rent-vs-buy · capital-gains tax",
 "元利／元金／据置／多段金利・実質APR・ストレステスト・繰上・借換・購入vs賃貸・譲渡税",
 "원리금/원금/거치/다단금리·실질APR·스트레스·중도상환·대환·매수vs임대·양도세"],
save:["＋存方案","+Save plan","＋案を保存","＋방안 저장"],saved:["已加入","Added","追加済","추가됨"],
grpMain:["房貸試算設定","Mortgage inputs","住宅ローン設定","대출 입력"],

function renderPlans(){
 const card=document.getElementById("plansCard");
 document.getElementById("clearPlans").textContent=PLANS.length?T("planClear"):"";
 if(!PLANS.length){ card.innerHTML=`<div class="empty">${T("planEmpty")}</div>`; return; }
 const cur=metricsFor(S);
 const cols=[{name:T("planCurrent"),m:cur,idx:-1}].concat(PLANS.map((p,i)=>({name:p.name,m:metricsFor(mergeState(p.snap)),idx:i})));
 const rows=[
   [T("kPmt"), c=>fmtNT(c.firstPayment)],
   [T("costTotalInt"), c=>fmtBig(c.totalInterest)],
   [T("stCost"), c=>fmtBig(c.totalCost)],
   [T("stApr"), c=>c.apr?pct(c.apr):"—"],
   [T("fYears"), (c,s)=>s?(Math.round(s.months/12)+T("yrU")):"—"],
 ];
 let html=`<div class="tw"><table><thead><tr><th>${T("planItem")}</th>${cols.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(([lb,fn])=>{ html+=`<tr><td>${lb}</td>${cols.map(c=>`<td class="v">${fn(c.m,c.m)}</td>`).join("")}</tr>`; });
 html+=`<tr><td>${T("planAction")}</td>${cols.map(c=>c.idx<0?`<td>—</td>`:`<td style="white-space:nowrap"><button class="mini" data-load="${c.idx}">${T("planLoad")}</button> <button class="mini" style="color:var(--danger)" data-del="${c.idx}">×</button></td>`).join("")}</tr>`;
 html+=`</tbody></table></div><div class="note">${T("planNote")}</div>`;
 card.innerHTML=html;
 (card.querySelectorAll("[data-load]")||[]).forEach(b=>b.onclick=()=>{S=mergeState(PLANS[+b.dataset.load].snap);renderAll();});
 (card.querySelectorAll("[data-del]")||[]).forEach(b=>b.onclick=()=>{PLANS.splice(+b.dataset.del,1);persist();renderPlans();});
}

/* ==================== 寬限期評估（比照 compound：寬限期內→期滿後） ==================== */
function renderGrace(cost){
 const gm=Math.round(S.grace*12);
 const on=(S.method===3)&&(gm>0);
 document.getElementById("s_grace").style.display=on?"":"none";
 document.getElementById("graceCard").style.display=on?"":"none";
 if(!on) return;
 const during=cost.firstPayment, after=cost.afterGracePayment;
 const duringTotal=during*gm;                    // 寬限期內只繳利息、本金不減，全數為利息支出
 const ngArgs=Object.assign({},argsFor(S),{method:["equal_payment","equal_principal"][S.graceMethod],graceMonths:0});
 const ng=E.amortize(ngArgs);                     // 同條件但「不設寬限」
 const extraInt=cost.totalInterest-ng.totalInterest;   // 因寬限多付的總利息
 document.getElementById("graceCard").innerHTML=
   `<div class="reads">`
   +read(fmtNT(during),T("gDuring"),"var(--tint)")
   +read(fmtNT(after),T("gAfter"))
   +read(fmtBig(duringTotal),T("gDuringTotal"),"var(--amber)")
   +read(fmtBig(extraInt),T("gExtra"),extraInt>0?"var(--danger)":"var(--ok)")
   +`</div><div class="note">${fill(T("graceNote"),{g:S.grace,gm:gm,d:fmtNT(during),a:fmtNT(after),j:fmtNT(after-during)})}</div>`;
}

/* ==================== 格式化 ==================== */
function fmtNT(n){n=Math.round(n);return "NT$"+n.toLocaleString("en-US");}
function fmtBig(n){ // 在地化大額
 const a=Math.abs(n);
 if(LG===1){if(a>=1e9)return "NT$"+(n/1e9).toFixed(2)+"B";if(a>=1e6)return "NT$"+(n/1e6).toFixed(2)+"M";if(a>=1e3)return "NT$"+(n/1e3).toFixed(0)+"K";return "NT$"+Math.round(n).toLocaleString("en-US");}
 const U=[["億","萬","元"],["","",""],["億","万","円"],["억","만","원"]][LG];
 if(a>=1e8)return (n/1e8).toFixed(2).replace(/\.?0+$/,"")+" "+U[0];
 if(a>=1e4)return Math.round(n/1e4).toLocaleString("en-US")+" "+U[1];
 return Math.round(n).toLocaleString("en-US")+" "+U[2];
}
const pct=x=>x.toFixed(2)+"%";

/* ==================== 建構 rateSpec ==================== */
function buildRateSpecFor(st){
 if(st.rateType===0) return {type:"single",rate:st.rate};
 if(st.rateType===1) return {type:"segments",segments:st.segments.map(s=>({months:s.months,rate:s.rate}))};
 return {type:"index",base:st.base,spread:st.spread};
}
function argsFor(st){
 return {principal:st.loan, months:Math.round(st.years*12), rateSpec:buildRateSpecFor(st),
  method:["equal_payment","equal_principal","interest_only","grace"][st.method],
  graceMonths:Math.round(st.grace*12), graceMethod:["equal_payment","equal_principal"][st.graceMethod]};
}
function buildRateSpec(){return buildRateSpecFor(S);}
function baseAmortArgs(){return argsFor(S);}
function metricsFor(st){return E.costAndAPR(Object.assign({},argsFor(st),{openFee:st.openFee,mgmtFeeMonthly:st.mgmt,insuranceAnnual:st.ins}));}

 const bindNum=(id,setter)=>{const el=document.getElementById(id);if(el)el.addEventListener("input",e=>{setter(parseFloat(e.target.value)||0);compute();});};
 const bindSel=(id,setter,re)=>{const el=document.getElementById(id);if(el)el.addEventListener("change",e=>{setter(parseInt(e.target.value));if(re)renderLeft();compute();});};
 const bindTog=(id,setter,re)=>{const el=document.getElementById(id);if(el)el.addEventListener("click",()=>{setter();if(re)renderLeft();compute();});};
 bindNum("price",v=>{S.price=v;S.loan=Math.round(S.price*S.ltv/100);document.getElementById("loan").value=S.loan;});
 bindNum("ltv",v=>{S.ltv=v;S.loan=Math.round(S.price*S.ltv/100);document.getElementById("loan").value=S.loan;});
 bindNum("loan",v=>{S.loan=v;if(S.price>0){S.ltv=Math.round(S.loan/S.price*1000)/10;const e=document.getElementById("ltv");if(e)e.value=S.ltv;}});
 bindNum("years",v=>S.years=v); bindNum("rate",v=>S.rate=v); bindNum("base",v=>S.base=v); bindNum("spread",v=>S.spread=v);
 bindNum("grace",v=>S.grace=v); bindNum("openFee",v=>S.openFee=v); bindNum("mgmt",v=>S.mgmt=v); bindNum("ins",v=>S.ins=v);
 bindNum("extraMonthly",v=>S.extraMonthly=v); bindNum("income",v=>S.income=v);
 bindNum("pen1",v=>S.penaltyStages[0].rate=v); bindNum("pen2",v=>S.penaltyStages[1].rate=v); bindNum("pen3",v=>S.penaltyStages[2].rate=v);
 bindSel("type",v=>{S.type=v;applyProgram();},true);
 bindSel("rateType",v=>S.rateType=v,true); bindSel("method",v=>S.method=v,true);
 bindSel("graceMethod",v=>S.graceMethod=v); bindSel("prepayMode",v=>S.prepayMode=v); bindSel("propOrder",v=>S.propOrder=v);
 S.segments.forEach((s,i)=>{bindNum("segM"+i,v=>S.segments[i].months=v);bindNum("segR"+i,v=>S.segments[i].rate=v);});
 document.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{S.segments.splice(parseInt(b.dataset.seg),1);renderLeft();compute();}));
 // refi
 bindTog("refiOn",()=>S.refi.on=!S.refi.on,true);
 [["rf_balance","balance"],["rf_rate","rate"],["rf_remain","remain"],["rf_newRate","newRate"],["rf_newYears","newYears"],["rf_openFee","openFee"],["rf_discharge","discharge"],["rf_setup","setup"],["rf_penalty","penalty"]].forEach(([id,k])=>bindNum(id,v=>S.refi[k]=v));
 bindTog("rvbOn",()=>S.rvb.on=!S.rvb.on,true);
 [["rvb_rent","rentMonthly"],["rvb_rentG","rentGrowth"],["rvb_homeG","homeGrowth"],["rvb_invest","invest"],["rvb_ownTax","ownTax"],["rvb_maintain","maintain"],["rvb_sellCost","sellCost"]].forEach(([id,k])=>bindNum(id,v=>S.rvb[k]=v));
 bindTog("sellOn",()=>S.sell.on=!S.sell.on,true);
 [["sell_sale","sale"],["sell_acq","acq"],["sell_deduct","deduct"],["sell_hold","hold"],["sell_remainLoan","remainLoan"]].forEach(([id,k])=>bindNum(id,v=>S.sell[k]=v));
 bindTog("sell_selfUse",()=>S.sell.selfUse=!S.sell.selfUse,true); bindTog("sell_repurchase",()=>S.sell.repurchase=!S.sell.repurchase,true);
 bindTog("mcOn",()=>S.mc.on=!S.mc.on,true);
 [["mc_r0","r0"],["mc_rMean","rMean"],["mc_rVol","rVol"]].forEach(([id,k])=>bindNum(id,v=>S.mc[k]=v));
}
function applyProgram(){
 if(S.type===1){ // 新青安
   S.rateType=1; S.segments=[{months:24,rate:1.775},{months:Math.max(12,Math.round(S.years*12)-24),rate:2.1}];
   if(S.years>40)S.years=40; if(S.grace>5)S.grace=5;
 }
}

addSegBtn.addEventListener("click",()=>{S.segments.push({months:12,rate:S.segments.length?S.segments[S.segments.length-1].rate:2.1});renderLeft();compute();});

/* ==================== 主計算 ==================== */
function compute(){
 const args=baseAmortArgs();
 const cost=E.costAndAPR(Object.assign({},args,{openFee:S.openFee,mgmtFeeMonthly:S.mgmt,insuranceAnnual:S.ins}));
 // 關鍵數據
 document.getElementById("k1l").textContent=T("kPmt");
 document.getElementById("k1n").textContent=fmtNT(cost.firstPayment);
 document.getElementById("k1s").textContent=T("kPmtS");
 document.getElementById("k2l").textContent=T("kInt");
 document.getElementById("k2n").textContent=fmtBig(cost.totalInterest);
 document.getElementById("k2s").textContent=T("kIntS")+" "+(cost.totalInterest/S.loan*100).toFixed(0)+"%";
 // hero
 document.getElementById("conc").innerHTML=fill(T("concBuy"),{p:fmtNT(cost.firstPayment),y:S.years,t:fmtBig(cost.totalPayment),i:fmtBig(cost.totalInterest)});
 document.getElementById("concs").innerHTML=fill(T("concSub"),{a:cost.apr?pct(cost.apr):"—",n:pct(cost.nominalRate)});
 // stats
 document.getElementById("stats").innerHTML=
   stat(fmtBig(cost.totalPayment),T("stTotal"))
  +stat(fmtBig(cost.totalCost),T("stCost"))
  +stat(cost.apr?pct(cost.apr):"—",T("stApr"))
  +stat(S.method===3?fmtNT(cost.graceJump):"—",T("stJump"));
 renderAdvisor(cost);
 renderConditions();
 renderPlans();
 renderGrace(cost);
 renderAmortChart(cost);
 renderCost(cost);
 renderCompare(args);
 renderStress(args);
 renderPrepay(args);
 renderRefi();
 renderRvb(args);
 renderSell();
 renderMC();
 renderReg(cost);
 renderTable(cost);
 setSectionTitles();
 persist();
}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);}
function stat(n,l){return `<div><div class="n">${n}</div><div class="l">${l}</div></div>`;}
function read(n,l,color){return `<div><div class="n" ${color?`style="color:${color}"`:""}>${n}</div><div class="l">${l}</div></div>`;}

function setSectionTitles(){
 [["s_grace","sGrace"],["s_plans","sPlans"],["s_chart","sChart"],["s_cost","sCost"],["s_compare","sCompare"],["s_stress","sStress"],["s_prepay","sPrepay"],["s_reg","sReg"],["s_tbl","sTbl"],["s_data","sData"],["s_advisor","sAdvisor"],["s_cond","sCond"],["s_mcOut","sMc"],["s_refiOut","sRefi"],["s_rvbOut","sRvb"],["s_sellOut","sSell"]].forEach(([id,k])=>{const el=document.getElementById(id);if(el){const sp=el.querySelector(".sp");el.textContent=T(k);if(sp)el.appendChild(sp);}});
}

/* ---- 檢視提醒 ---- */
function renderAdvisor(cost){
 const items=[];
 const ratio=S.income>0?cost.firstPayment/S.income*100:0;
 if(ratio>40) items.push(["danger","月付佔收入偏高",`目前月付佔月收入約 ${ratio.toFixed(0)}%，銀行實務多以 40% 為警戒。升息時將更吃緊。`]);
 if(S.method===3&&cost.graceJump>0) items.push(["amber","寬限期後月付會跳增",`寬限期結束後月付從 ${fmtNT(cost.firstPayment)} 跳增為 ${fmtNT(cost.afterGracePayment)}（＋${fmtNT(cost.graceJump)}）。務必先確認屆時負擔得起。`]);
 if(S.method===2) items.push(["amber","利息到期一次還本","此方式期間只付息，本金到期一次清償；總利息最高，且到期需備足本金。"]);
 if(cost.apr&&cost.apr-cost.nominalRate>0.05) items.push(["tint","實質利率高於名目",`把開辦費等一次性費用攤入後，實質年利率 ${pct(cost.apr)} 高於名目 ${pct(cost.nominalRate)}。比較不同銀行時看實質利率更準。`]);
 const en={danger:["High payment-to-income",""],amber:["",""],tint:["",""]};
 const box=document.getElementById("advisor");
 if(!items.length){box.innerHTML=`<div class="empty">${["目前沒有需要特別注意的提醒。","No notices right now.","特に注意点はありません。","특별한 알림이 없습니다."][LG]}</div>`;document.getElementById("advCount").textContent="";return;}
 const col={danger:"var(--danger)",amber:"var(--amber)",tint:"var(--tint)"};
 box.innerHTML=items.map(([c,t,d])=>`<div class="adv"><span class="dot" style="background:${col[c]}"></span><div class="ac"><div class="at">${t}</div><div class="ad">${d}</div></div></div>`).join("");
 document.getElementById("advCount").textContent=items.length;
}

function renderAmortChart(cost){
 const rows=cost.rows; const W=700,H=220,pad=6;
 const yearly=[]; for(let i=11;i<rows.length;i+=12) yearly.push(rows[i]); if(rows.length&&(rows.length%12))yearly.push(rows[rows.length-1]);
 const maxBal=Math.max(...rows.map(r=>r.balance),S.loan);
 const n=yearly.length; const bw=(W-2*pad)/Math.max(1,n);
 let bars="",line="M";
 // 每年：本金累計 vs 利息累計 堆疊 + 餘額線
 let cumP=0,cumI=0; const totP=cost.totalPrincipal,totI=cost.totalInterest;
 yearly.forEach((r,k)=>{
   // 累計到該期
 });
 // 簡化：畫每年餘額線 + 該年本金/利息長條
 const maxPay=Math.max(...yearly.map(r=>r.payment))*12*1.1||1;
 yearly.forEach((r,k)=>{
   const x=pad+k*bw;
   const ph=(r.principal*12/maxPay)*(H-30), ih=(r.interest*12/maxPay)*(H-30);
   bars+=`<rect x="${x+bw*0.15}" y="${H-20-ph}" width="${bw*0.7}" height="${ph}" fill="var(--tint)" opacity="0.9"/>`;
   bars+=`<rect x="${x+bw*0.15}" y="${H-20-ph-ih}" width="${bw*0.7}" height="${ih}" fill="var(--amber)" opacity="0.85"/>`;
   const bx=x+bw/2, by=H-20-(r.balance/maxBal)*(H-30);
   line+=(k===0?"":"L")+bx.toFixed(1)+" "+by.toFixed(1)+" ";
 });
 document.getElementById("chAmort").innerHTML=bars+`<path d="${line}" fill="none" stroke="var(--label)" stroke-width="2" opacity="0.6"/>`;
 document.getElementById("chartNote").innerHTML=`<span style="color:var(--tint)">■</span> ${T("lgPrin")}　<span style="color:var(--amber)">■</span> ${T("lgInt")}　— ${T("lgBal")}（${["每年","yearly","毎年","매년"][LG]}）`;
}

/* ---- 全成本瀑布 ---- */
function renderCost(cost){
 const wf=cost.waterfall; const labels=T("wf");
 const parts=[wf.principal,wf.interest,wf.openFee,wf.mgmt,wf.insurance,wf.penalty];
 const total=parts.reduce((a,b)=>a+b,0);
 const cols=["var(--label3)","var(--amber)","var(--danger)","var(--tint)","#8E8E93","var(--danger)"];
 const W=700,H=200,pad=8; let x=pad,run=0,svg="";
 const maxV=total; const bw=(W-2*pad)/7;
 parts.forEach((v,i)=>{
   const h=(v/maxV)*(H-40); const y=H-24-((run+v)/maxV)*(H-40);
   if(v>0){svg+=`<rect x="${x+bw*0.1}" y="${H-24-((run+v)/maxV)*(H-40)}" width="${bw*0.8}" height="${(v/maxV)*(H-40)}" fill="${cols[i]}"/>`;}
   svg+=`<text x="${x+bw/2}" y="${H-8}" font-size="10" fill="var(--label2)" text-anchor="middle">${labels[i]}</text>`;
   run+=v; x+=bw;
 });
 // total bar
 svg+=`<rect x="${x+bw*0.1}" y="${H-24-(total/maxV)*(H-40)}" width="${bw*0.8}" height="${(total/maxV)*(H-40)}" fill="var(--label)"/>`;
 svg+=`<text x="${x+bw/2}" y="${H-8}" font-size="10" fill="var(--label2)" text-anchor="middle">${labels[6]}</text>`;
 document.getElementById("chWf").innerHTML=svg;
 document.getElementById("costReads").innerHTML=
   read(pct(cost.nominalRate),T("costNominal"))
  +read(cost.apr?pct(cost.apr):"—",T("costReal"),"var(--tint)")
  +read(fmtBig(cost.totalInterest),T("costTotalInt"),"var(--amber)")
  +read(fmtBig(cost.totalCost),T("costTotalCost"));
 document.getElementById("costNote").textContent=["實質年利率把開辦費、帳管費、火險地震險攤入現金流以 XIRR 求解，代表你真正負擔的年化成本。","The real APR solves the fee-inclusive cash flow via XIRR — your true annualized cost.","実質APRは手数料等を含めXIRRで解いた、真の年率コストです。","실질 APR은 수수료를 포함해 XIRR로 구한 실제 연간 비용입니다."][LG];
}

/* ---- 買vs租 ---- */
function renderRvb(args){
 const on=S.rvb.on;
 document.getElementById("s_rvbOut").style.display=on?"":"none";
 document.getElementById("rvbOutCard").style.display=on?"":"none";
 if(!on)return;
 const o={price:S.price,downPayment:Math.max(0,S.price-S.loan),years:S.years,homeGrowth:S.rvb.homeGrowth,
   rentMonthly:S.rvb.rentMonthly,rentGrowth:S.rvb.rentGrowth,investReturn:S.rvb.invest,
   ownTaxAnnual:S.rvb.ownTax,maintainAnnual:S.rvb.maintain,sellCostRate:S.rvb.sellCost,loan:args};
 const rb=E.rentVsBuy(o);
 // chart: two lines buy equity vs rent invest
 const W=700,H=200,pad=8; const rows=rb.rows.filter((_,i)=>i%12===0||i===rb.rows.length-1);
 // buy equity ~ homeValue path approx: interpolate
 const buyEq=rows.map((r,k)=>{const yr=r.m/12;const hv=S.price*Math.pow(1+S.rvb.homeGrowth/100,yr);return hv-r.balance;});
 const rentEq=rows.map(r=>r.investRent);
 const maxV=Math.max(...buyEq,...rentEq,1);
 const path=(arr)=>{let d="M";arr.forEach((v,k)=>{const x=pad+k/(arr.length-1)*(W-2*pad);const y=H-20-(v/maxV)*(H-40);d+=(k?"L":"")+x.toFixed(1)+" "+y.toFixed(1)+" ";});return d;};
 document.getElementById("chRvb").innerHTML=
   `<path d="${path(buyEq)}" fill="none" stroke="var(--tint)" stroke-width="2.2"/>`
  +`<path d="${path(rentEq)}" fill="none" stroke="var(--amber)" stroke-width="2.2"/>`;
 document.getElementById("rvbReads").innerHTML=
   read(fmtBig(rb.buyNetWorth),T("rvbBuy"),"var(--tint)")
  +read(fmtBig(rb.rentNetWorth),T("rvbRent"),"var(--amber)")
  +read(fmtBig(Math.abs(rb.gap)),T("rvbGap"))
  +read(rb.buyBetter?T("rvbBuyWin"):T("rvbRentWin"),"",rb.buyBetter?"var(--tint)":"var(--amber)");
 document.getElementById("rvbNote").innerHTML=`<span style="color:var(--tint)">—</span> ${T("rvbBuy")}　<span style="color:var(--amber)">—</span> ${T("rvbRent")}<br>`+T("rvbN");
}

/* ---- 法規檢查 ---- */
function renderReg(cost){
 const order=["first","second","third"][S.propOrder]||"first";
 const q=S.type===1?{enable:true,hasOwnHome:false,age:30,everUsed:false,loanAmount:S.loan,years:S.years,graceYears:S.grace}:null;
 const rc=E.regulationCheck({price:S.price,loan:S.loan,propertyOrder:order,monthlyPayment:cost.firstPayment,income:S.income,qingan:q});

/* ==================== V1 STORAGE 抽象（window.storage || localStorage，file:// 也能存） ==================== */
const STORAGE={
 set(k,v){try{if(window.storage&&window.storage.set){const p=window.storage.set(k,v);if(p&&p.catch)p.catch(()=>{});return;}}catch(_){}
   try{localStorage.setItem(k,v);}catch(_){}},
 async get(k){try{if(window.storage&&window.storage.get){const r=await window.storage.get(k);if(r&&r.value!=null)return r.value;}}catch(_){}
   try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(_){}return null;},
};
/* 深合併：把外部（可能不完整）的狀態疊到 DEF 上，巢狀物件也補齊預設，避免壞檔造成缺欄位 */
function mergeState(over){
 const out=JSON.parse(JSON.stringify(DEF));
 if(!over||typeof over!=="object") return out;
 for(const k of Object.keys(over)){
   const v=over[k];
   if(v&&typeof v==="object"&&!Array.isArray(v)&&out[k]&&typeof out[k]==="object"&&!Array.isArray(out[k]))
     out[k]=Object.assign({},out[k],v);
   else out[k]=v;
 }
 return out;
}
/* 自動存檔（工作狀態＋所有方案），開啟自動恢復 */
function persist(){try{STORAGE.set("mortgagecalc",JSON.stringify({S,LG,PLANS}));}catch(e){}}
async function restore(){try{const v=await STORAGE.get("mortgagecalc");if(v){const d=JSON.parse(v);if(d.S)S=mergeState(d.S);if(Array.isArray(d.PLANS))PLANS=d.PLANS;if(typeof d.LG==="number")LG=d.LG;return true;}}catch(e){}return false;}
/* 儲存檔案：把「所有方案＋目前設定＋參數＋語言」匯出成一個檔，下次可讀回 */
function exportAll(){
 const payload=JSON.stringify({app:"mortgage",version:1,savedAt:new Date().toISOString(),S,LG,PLANS},null,2);
 try{const blob=new Blob([payload],{type:"application/json"});const a=document.createElement("a");
   a.href=URL.createObjectURL(blob);a.download="房貸試算_存檔_"+new Date().toISOString().slice(0,10)+".json";a.click();}catch(_){}
}
function importAllFromText(text){
 try{const d=JSON.parse(text);
   if(d.S)S=mergeState(d.S);
   if(Array.isArray(d.PLANS))PLANS=d.PLANS.filter(p=>p&&p.snap).map(p=>({name:p.name||T("planName"),snap:mergeState(p.snap)}));
   if(typeof d.LG==="number")LG=d.LG;
   persist(); renderAll(); return true;
 }catch(_){return false;}
}
