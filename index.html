<style>
:root{

html{background:#F2F2F7;color-scheme:light}
html.dark{background:#000;color-scheme:dark}
body.dark{
  --tint:#3FA7A0; --gold:#E8C05A; --bg:#000; --card:#1C1C1E;
  --label:#FFF; --label2:rgba(235,235,245,.66); --label3:rgba(235,235,245,.36);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{

}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;max-width:960px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.lang,button.mode{background:var(--fill);border:none;border-radius:980px;padding:7px 11px;

select.lang option{background:var(--card);color:var(--label)}
.hero{background:var(--hero);border-radius:20px;padding:40px 30px;margin:8px 0 30px;color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.25;position:relative;z-index:2}
.hero p{font-size:16px;color:#B9CCE0;margin-top:14px;position:relative;z-index:2;max-width:560px}
.hero .arrow{position:absolute;right:-10px;bottom:-20px;width:200px;height:200px;opacity:.9;z-index:1}
@media(max-width:560px){.hero{padding:32px 22px}.hero h1{font-size:25px}.hero .arrow{width:140px;height:140px;opacity:.5}}
.sec{font-size:13px;font-weight:600;color:var(--label2);margin:0 4px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:34px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px;
  display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;
  border:1px solid transparent;transition:transform .15s,border-color .15s;position:relative}
a.card:hover{transform:translateY(-2px);border-color:var(--tint)}
.card .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:var(--fill);flex:none}
.card.live .ico{background:linear-gradient(135deg,#0E1B2A,#08355F)}
.card h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.card p{font-size:13.5px;color:var(--label2);line-height:1.55;flex:1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;align-self:flex-start}
.tag.on{background:rgba(10,124,116,.14);color:var(--tint)}
.tag.soon{background:var(--fill);color:var(--label3)}
.card .go{font-size:13px;font-weight:600;color:var(--tint);margin-top:2px}
.card.soon{cursor:default}
.card.soon h3,.card.soon p{opacity:.72}
.why{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:24px;margin-bottom:34px}
.why h2{font-size:19px;font-weight:700;margin-bottom:14px;letter-spacing:-.2px}
.why ul{list-style:none;display:grid;gap:14px}
.why li{display:flex;gap:12px;align-items:flex-start}
.why .dot{width:8px;height:8px;border-radius:50%;background:var(--tint);margin-top:8px;flex:none}
.why li b{font-weight:650}
.why li span{color:var(--label2);font-size:14px}
.foot{border-top:1px solid var(--sep);padding-top:22px;color:var(--label2);font-size:12.5px;line-height:1.7}

let LG=0;
const $=id=>document.getElementById(id);
function render(){
  document.documentElement.lang=["zh-Hant","en","ja","ko"][LG];
  $("brandName").textContent=D.brand[LG];
  $("heroTitle").innerHTML=D.heroTitle[LG];
  $("heroSub").textContent=D.heroSub[LG];
  $("secTools").textContent=D.secTools[LG];
  $("whyTitle").textContent=D.whyTitle[LG];
  $("foot").textContent=D.foot[LG];
  $("mode").textContent=document.body.classList.contains("dark")?D.modeLight[LG]:D.modeDark[LG];
  $("grid").innerHTML=D.tools[LG].map(t=>{
    const ico=t[0],name=t[1],desc=t[2],live=t[3],url=t[4];
    const tag=live?'<span class="tag on">'+D.live[LG]+'</span>':'<span class="tag soon">'+D.soon[LG]+'</span>';
    if(live){
      return '<a class="card live" href="'+url+'"><div class="ico">'+ico+'</div>'+tag+
        '<h3>'+name+'</h3><p>'+desc+'</p><div class="go">'+D.open[LG]+'</div></a>';
    }
    return '<div class="card soon"><div class="ico">'+ico+'</div>'+tag+
      '<h3>'+name+'</h3><p>'+desc+'</p></div>';
  }).join("");
  $("whyList").innerHTML=D.why[LG].map(function(x){
    return '<li><span class="dot"></span><span><b>'+x[0]+'</b>　'+x[1]+'</span></li>';}).join("");

$("lang").addEventListener("change",function(e){LG=+e.target.value;render();});
$("mode").addEventListener("click",function(){
  document.body.classList.toggle("dark");
  document.documentElement.classList.toggle("dark");
  render();
});
(function(){var l=(navigator.language||"zh").toLowerCase();
  LG=l.startsWith("ja")?2:l.startsWith("ko")?3:(l.startsWith("zh")?0:1);})();
if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches){
  document.body.classList.add("dark");document.documentElement.classList.add("dark");}
render();
